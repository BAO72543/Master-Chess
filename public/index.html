<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Master Chess HTML5</title>
  
  <style>
    /* CSS Reset and Font Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none; /* Prevent text selection in games */
    }

    body {
      background-color: #1a1a2e;
      font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* No scrolling allowed */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The Game Container - scales to fit screen but maintains aspect ratio */
    #game-container {
      width: 100%;
      height: 100%;
      max-width: 800px; /* Typical portrait/square-ish max for mobile/desktop blend */
      max-height: 1000px;
      position: relative;
      background: radial-gradient(circle at center, #2e2e4f 0%, #161625 100%);
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* Screen Management */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }
    
    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* =========================================
       MAIN MENU SCREEN
       ========================================= */
    #menu-screen {
      justify-content: center;
      padding: 20px;
    }

    /* Floating Chess Pieces Background Effect */
    .bg-pieces {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.1;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="%23ffffff"/></svg>');
      background-size: 150px;
      background-position: center;
      animation: floatBg 30s linear infinite;
    }

    @keyframes floatBg {
      0% { background-position: 0px 0px; }
      100% { background-position: 150px 150px; }
    }

    /* Game Logo */
    .game-logo {
      z-index: 10;
      text-align: center;
      margin-bottom: 60px;
      animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .game-logo h1 {
      font-size: 64px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 6px 0 #0f4c81, 0 12px 15px rgba(0,0,0,0.5);
      margin: 0;
      line-height: 1;
    }
    .game-logo span {
      display: block;
      font-size: 24px;
      color: #ffd700;
      text-shadow: 0 3px 0 #b38f00, 0 6px 10px rgba(0,0,0,0.4);
      margin-top: -5px;
    }

    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Chunky Game Buttons */
    .menu-buttons {
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 320px;
    }

    .btn-game {
      background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
      border: 4px solid #fff;
      border-radius: 20px;
      padding: 18px 24px;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 0 #0088cc, 0 15px 20px rgba(0,0,0,0.4);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn-game:active {
      transform: translateY(8px);
      box-shadow: 0 0px 0 #0088cc, 0 5px 10px rgba(0,0,0,0.4);
    }

    .btn-secondary {
      background: linear-gradient(to bottom, #f6d365 0%, #fda085 100%);
      box-shadow: 0 8px 0 #d97745, 0 15px 20px rgba(0,0,0,0.4);
    }
    .btn-secondary:active {
      box-shadow: 0 0px 0 #d97745, 0 5px 10px rgba(0,0,0,0.4);
    }
    
    .btn-tertiary {
      background: linear-gradient(to bottom, #43e97b 0%, #38f9d7 100%);
      box-shadow: 0 8px 0 #28b463, 0 15px 20px rgba(0,0,0,0.4);
    }
    .btn-tertiary:active {
      box-shadow: 0 0px 0 #28b463, 0 5px 10px rgba(0,0,0,0.4);
    }

    /* Audio Toggle */
    .audio-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.2);
      border: 3px solid #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      font-size: 24px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }
    .audio-toggle:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 rgba(0,0,0,0.2);
    }


    /* =========================================
       IN-GAME SCREEN
       ========================================= */
    #game-screen {
      padding: 20px;
      justify-content: space-between;
    }

    /* Top HUD */
    .hud-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .btn-pause {
      background: #ff4757;
      border: 3px solid #fff;
      border-radius: 12px;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 0 #c0392b, 0 10px 10px rgba(0,0,0,0.3);
    }
    .btn-pause:active {
      transform: translateY(5px);
      box-shadow: 0 0px 0 #c0392b, 0 5px 10px rgba(0,0,0,0.3);
    }

    .player-hud {
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.5);
      border-radius: 30px;
      padding: 5px 15px 5px 5px;
      border: 2px solid rgba(255,255,255,0.2);
      gap: 10px;
    }
    .player-avatar {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .player-info {
      display: flex;
      flex-direction: column;
    }
    .player-name {
      color: #fff;
      font-size: 14px;
      font-weight: bold;
    }
    .player-score {
      color: #ffd700;
      font-size: 12px;
      font-weight: 800;
    }

    /* Board Area */
    .board-wrapper {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1/1;
      background: #739552;
      border: 8px solid #3c2a21;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      position: relative;
    }
    .board-sq {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .board-sq.light { background: #ebecd0; }
    .board-sq.dark { background: #739552; }
    
    .board-sq img.piece {
      width: 90%;
      height: 90%;
      pointer-events: none;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
    }

    /* Bottom HUD */
    .hud-bottom {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
    }

    /* Pause Menu Overlay */
    #pause-menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #pause-menu.active {
      opacity: 1;
      pointer-events: auto;
    }
    .pause-box {
      background: #2e2e4f;
      border: 4px solid #fff;
      border-radius: 20px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #pause-menu.active .pause-box {
      transform: scale(1);
    }

  </style>
</head>
<body>

  <div id="game-container">
    
    <!-- AUDIO TOGGLE -->
    <div class="audio-toggle" id="btn-audio" onclick="toggleAudio()">🔊</div>

    <!-- =========================================
         MAIN MENU SCREEN
         ========================================= -->
    <div id="menu-screen" class="screen active">
      <div class="bg-pieces"></div>
      
      <div class="game-logo">
        <h1>Master</h1>
        <span>CHESS</span>
      </div>

      <div class="menu-buttons">
        <button class="btn-game" onclick="startGame('bot')">
          <span>🤖</span> Play vs Bot
        </button>
        <button class="btn-game btn-secondary" onclick="startGame('online')">
          <span>🌍</span> Multiplayer
        </button>
        <button class="btn-game btn-tertiary" onclick="startGame('puzzles')">
          <span>🧩</span> Puzzles
        </button>
      </div>
    </div>


    <!-- =========================================
         IN-GAME SCREEN
         ========================================= -->
    <div id="game-screen" class="screen">
      
      <!-- Top HUD (Opponent) -->
      <div class="hud-top">
        <div class="player-hud">
          <div class="player-avatar">🤖</div>
          <div class="player-info">
            <span class="player-name">Grandmaster Bot</span>
            <span class="player-score">Level 10</span>
          </div>
        </div>
        <button class="btn-pause" onclick="togglePause()">II</button>
      </div>

      <!-- Chess Board -->
      <div class="board-wrapper" id="main-board">
        <!-- Rendered via JS -->
      </div>

      <!-- Bottom HUD (Player) -->
      <div class="hud-bottom">
        <div class="player-hud">
          <div class="player-info" style="text-align: right;">
            <span class="player-name">You</span>
            <span class="player-score">Beginner</span>
          </div>
          <div class="player-avatar">👤</div>
        </div>
      </div>

    </div>

    <!-- PAUSE MENU OVERLAY -->
    <div id="pause-menu">
      <div class="pause-box">
        <h2 style="color: #fff; text-align: center; margin-bottom: 10px; font-size: 32px;">PAUSED</h2>
        <button class="btn-game" style="font-size: 20px; padding: 12px 20px;" onclick="togglePause()">Resume</button>
        <button class="btn-game btn-secondary" style="font-size: 20px; padding: 12px 20px;" onclick="returnToMenu()">Quit Game</button>
      </div>
    </div>

  </div>

  <script>
    // Screen Management
    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startGame(mode) {
      // In a real game, initialize engine/socket here based on mode
      switchScreen('game-screen');
      // Small delay to ensure rendering before drawing board (optional, but safe)
      setTimeout(() => renderBoard('main-board'), 100);
    }

    function returnToMenu() {
      document.getElementById('pause-menu').classList.remove('active');
      switchScreen('menu-screen');
    }

    // Pause Menu
    function togglePause() {
      const pm = document.getElementById('pause-menu');
      if (pm.classList.contains('active')) {
        pm.classList.remove('active');
      } else {
        pm.classList.add('active');
      }
    }

    // Audio Toggle Mock
    let audioOn = true;
    function toggleAudio() {
      audioOn = !audioOn;
      document.getElementById('btn-audio').innerHTML = audioOn ? '🔊' : '🔇';
    }

    // Render 8x8 Board with SVG piece images
    function renderBoard(elementId) {
      const container = document.getElementById(elementId);
      if (!container) return;
      container.innerHTML = '';

      // SVG Piece mapping using /piece/cburnett/ directory
      const pieceMap = {
        'r': 'bR', 'n': 'bN', 'b': 'bB', 'q': 'bQ', 'k': 'bK', 'p': 'bP',
        'R': 'wR', 'N': 'wN', 'B': 'wB', 'Q': 'wQ', 'K': 'wK', 'P': 'wP'
      };

      const defaultBoard = [
        ['r','n','b','q','k','b','n','r'],
        ['p','p','p','p','p','p','p','p'],
        ['.','.','.','.','.','.','.','.'],
        ['.','.','.','.','.','.','.','.'],
        ['.','.','.','.','P','.','.','.'],
        ['.','.','.','.','.','N','.','.'],
        ['P','P','P','P','.','P','P','P'],
        ['R','N','B','Q','K','B','.','R']
      ];

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement('div');
          const isLight = (r + c) % 2 === 0;
          sq.className = 'board-sq ' + (isLight ? 'light' : 'dark');

          const pChar = defaultBoard[r][c];
          if (pChar !== '.' && pieceMap[pChar]) {
            const img = document.createElement('img');
            img.className = 'piece';
            img.src = '/piece/cburnett/' + pieceMap[pChar] + '.svg';
            img.alt = pChar;
            sq.appendChild(img);
          }

          container.appendChild(sq);
        }
      }
    }
  </script>
</body>
</html>
