<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Master Chess HTML5</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    /* CSS Reset and Font Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none; /* Prevent text selection in games */
    }

    body {
      background-color: #1a1a2e;
      font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* No scrolling allowed */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* The Game Container - scales to fit screen but maintains aspect ratio */
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: radial-gradient(circle at center, #2e2e4f 0%, #161625 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Screen Management */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }
    
    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .screen.zoom-out-fade {
      opacity: 0 !important;
      transform: scale(1.5) !important;
      transition: opacity 0.5s ease, transform 0.5s ease !important;
    }

    .btn-bullet-toggle {
      background: linear-gradient(to bottom, #7f8c8d 0%, #95a5a6 100%);
      box-shadow: 0 8px 0 #5f6a6b, 0 15px 20px rgba(0,0,0,0.4);
    }
    .btn-bullet-toggle.active {
      background: linear-gradient(to bottom, #ff4757 0%, #ff6b81 100%) !important;
      box-shadow: 0 8px 0 #cf2a2a, 0 15px 20px rgba(255, 71, 87, 0.4) !important;
      animation: pulseGlow 1.5s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 8px 0 #cf2a2a, 0 15px 20px rgba(255, 71, 87, 0.4); }
      100% { box-shadow: 0 8px 0 #cf2a2a, 0 15px 30px rgba(255, 71, 87, 0.8); }
    }

    .pulse {
      animation: pulseAnim 1s infinite alternate;
    }
    @keyframes pulseAnim {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    /* =========================================
       MAIN MENU SCREEN
       ========================================= */
    #menu-screen {
      padding: 20px;
    }

    /* Layout Containers */
    .screen-content {
      display: flex;
      width: 100%;
      max-width: 1200px;
      height: 100%;
      justify-content: center;
      align-items: center;
      gap: 40px;
    }

    .main-column {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 800px;
      height: 100%;
      justify-content: center;
      align-items: center;
    }

    #game-screen .main-column {
      justify-content: space-between;
    }

    /* Side Panels */
    .side-panel {
      display: none; /* Hidden by default on mobile */
      flex-direction: column;
      background: rgba(0, 0, 0, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      padding: 24px;
      width: 320px;
      height: min(80vh, 600px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      color: #fff;
      z-index: 10;
    }

    .side-panel h3 {
      margin: 0 0 16px 0;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ffd700;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    /* Leaderboard Styles */
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding-right: 12px; /* Prevent scrollbar sticking */
    }
    .lb-item {
      display: flex;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    .lb-score { color: #4facfe; }

    /* Move History Styles */
    .move-list {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      margin-bottom: 16px;
      padding-right: 12px; /* Prevent scrollbar sticking */
    }
    .move-row {
      display: flex;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-family: monospace;
      font-size: 16px;
    }
    .move-row:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    .move-num { width: 40px; color: #888; }
    .move-white { flex: 1; color: #fff; font-weight: bold; }
    .move-black { flex: 1; color: #aaa; font-weight: bold; }

    .match-controls {
      display: flex;
      gap: 10px;
    }
    .match-controls .btn-game { flex: 1; }

    /* Show side panels on wide screens */
    @media (min-width: 900px) {
      .side-panel {
        display: flex;
      }
    }

    /* Customization Screen Layout for Widescreen / Desktop */
    .customization-content {
      width: 100%;
      max-width: 1200px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 40px;
      box-sizing: border-box;
      align-items: stretch;
    }

    @media (min-width: 900px) {
      .customization-content {
        grid-template-columns: 1fr 1fr;
        gap: 25px;
        align-items: stretch;
      }
    }

    .skin-section-panel {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      height: 100%;
      box-sizing: border-box;
    }

    .skin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      flex: 1;
      align-content: start;
    }

    .skin-card {
      backdrop-filter: blur(10px);
      padding: 10px 8px;
      border-radius: 12px;
      text-align: center;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 155px;
      box-sizing: border-box;
    }

    .skin-preview-placeholder {
      height: 56px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .skin-title-placeholder {
      height: 20px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .skin-badge-container {
      height: 48px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Mobile HUD scaling */
    @media (max-width: 600px) {
      .player-hud {
        padding: 4px 8px;
        gap: 6px;
        height: 42px;
      }
      .player-avatar {
        width: 28px;
        height: 28px;
        font-size: 18px;
        line-height: 28px;
      }
      .player-name {
        font-size: 13px;
      }
      .player-score {
        font-size: 10px;
      }
      .btn-back {
        padding: 6px 10px !important;
        font-size: 12px !important;
      }
      .game-timer {
        font-size: 16px !important;
        padding: 4px 8px !important;
        min-width: 50px !important;
      }
      .hud-top {
        gap: 6px !important;
      }
      .hud-bottom {
        gap: 6px !important;
      }
    }

    /* Floating Chess Pieces Background Effect */
    .bg-pieces {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.1;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="%23ffffff"/></svg>');
      background-size: 150px;
      background-position: center;
      animation: floatBg 30s linear infinite;
    }

    @keyframes floatBg {
      0% { background-position: 0px 0px; }
      100% { background-position: 150px 150px; }
    }

    /* Game Logo */
    .game-logo {
      z-index: 10;
      text-align: center;
      margin-bottom: 60px;
      animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(0, 0, 0, 0.45);
      padding: 24px 48px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .game-logo h1 {
      font-size: 64px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 6px 0 #161625, 0 12px 20px rgba(0,0,0,0.8);
      margin: 0;
      line-height: 1;
    }
    .game-logo span {
      display: block;
      font-size: 28px;
      font-weight: 800;
      color: #ffd700;
      letter-spacing: 8px;
      text-shadow: 0 3px 0 #996515, 0 6px 15px rgba(0,0,0,0.6);
      margin-top: 5px;
    }

    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Chunky Game Buttons */
    .menu-buttons {
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 320px;
    }

    .btn-game {
      background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
      border: 4px solid #fff;
      border-radius: 20px;
      padding: 18px 24px;
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      cursor: pointer;
      box-shadow: 0 8px 0 #0088cc, 0 15px 20px rgba(0,0,0,0.4);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn-game:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.15);
    }

    .btn-game:active {
      transform: translateY(8px) scale(1) !important;
      box-shadow: 0 0px 0 #0088cc, 0 5px 10px rgba(0,0,0,0.4);
    }

    .btn-secondary {
      background: linear-gradient(to bottom, #f6d365 0%, #fda085 100%);
      box-shadow: 0 8px 0 #d97745, 0 15px 20px rgba(0,0,0,0.4);
    }
    .btn-secondary:active {
      box-shadow: 0 0px 0 #d97745, 0 5px 10px rgba(0,0,0,0.4);
    }
    
    .btn-tertiary {
      background: linear-gradient(to bottom, #43e97b 0%, #38f9d7 100%);
      box-shadow: 0 8px 0 #28b463, 0 15px 20px rgba(0,0,0,0.4);
    }
    .btn-tertiary:active {
      box-shadow: 0 0px 0 #28b463, 0 5px 10px rgba(0,0,0,0.4);
    }



    /* Pairing Screen */
    .pairing-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 60px 40px 40px 40px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .pairing-container h2 {
      color: #fff;
      margin-bottom: 30px;
      text-align: center;
    }
    .pairing-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top-color: #4facfe;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .pairing-match {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      text-align: center;
      gap: 15px;
    }
    .match-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      font-weight: bold;
      gap: 10px;
    }
    .match-player .player-avatar {
      width: 60px; height: 60px; font-size: 32px;
    }
    .match-vs {
      font-size: 24px; color: #ffd700; font-weight: 900; font-style: italic;
    }
    .match-rating {
      color: #ffd700; font-size: 14px;
    }

    /* =========================================
       IN-GAME SCREEN
       ========================================= */
    #game-screen {
      padding: 20px;
    }

    /* Top HUD */
    .hud-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .btn-pause {
      display: none; /* Hide pause button from main screen layout */
    }

    .btn-back {
      background: linear-gradient(to bottom, #747d8c 0%, #2f3542 100%) !important;
      box-shadow: 0 4px 0 #1e222b, 0 8px 10px rgba(0,0,0,0.3) !important;
      padding: 8px 14px !important;
      font-size: 14px !important;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 12px !important;
      border: 3px solid #fff !important;
      margin: 0;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }
    .btn-back:active {
      transform: translateY(4px) !important;
      box-shadow: 0 0px 0 #1e222b, 0 4px 5px rgba(0,0,0,0.3) !important;
    }

    .player-hud {
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.5);
      border-radius: 30px;
      padding: 6px 16px;
      border: 2px solid rgba(255,255,255,0.2);
      gap: 12px;
      height: 52px;
    }
    .player-avatar {
      width: 38px;
      height: 38px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .player-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .player-name {
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-score {
      color: #ffd700;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 480px) {
      .player-hud { padding: 4px 10px; gap: 8px; }
      .player-avatar { width: 30px; height: 30px; font-size: 16px; }
      .player-name { font-size: 12px; }
      .player-score { font-size: 10px; }
    }

    /* Board Area */
    .board-wrapper {
      width: min(90vw, 70vh);
      height: min(90vw, 70vh);
      aspect-ratio: 1/1;
      background: #739552;
      border: 8px solid #3c2a21;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      position: relative;
    }
    .board-sq {
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .board-classic .board-sq.light { background: #ebecd0; }
    .board-classic .board-sq.dark { background: #739552; }

    /* Dusk — warm amber and dark brown */
    .board-dusk .board-sq.light { background: #e8c98a; }
    .board-dusk .board-sq.dark { background: #7a4a28; }

    /* Ocean — cool teal and slate */
    .board-ocean .board-sq.light { background: #a8d8ea; }
    .board-ocean .board-sq.dark { background: #1b6ca8; }

    /* Midnight — high contrast near-black */
    .board-midnight .board-sq.light { background: #3a3a5c; }
    .board-midnight .board-sq.dark { background: #1a1a2e; }

    /* Additional Premium Boards */
    .board-forest .board-sq.light { background: #c1d9b7; }
    .board-forest .board-sq.dark { background: #4a7542; }
    
    .board-magma .board-sq.light { background: #fca311; }
    .board-magma .board-sq.dark { background: #780000; }
    
    .board-bubblegum .board-sq.light { background: #ffc2d1; }
    .board-bubblegum .board-sq.dark { background: #fb6f92; }
    
    .board-monochrome .board-sq.light { background: #e0e0e0; }
    .board-monochrome .board-sq.dark { background: #424242; }
    
    .board-neon .board-sq.light { background: #0b090a; }
    .board-neon .board-sq.dark { background: #38f9d7; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }

    .board-sq.selected { background: #f5f682 !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
    
    .board-sq img.piece {
      width: 90%;
      height: 90%;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s;
    }
    .board-sq img.piece.dragging {
      transform: scale(1.3) rotate(-5deg);
      filter: drop-shadow(0 15px 10px rgba(0,0,0,0.6));
      z-index: 1000;
      position: relative;
    }
    .board-sq.selected img.piece {
      transform: scale(1.3) rotate(-5deg);
      filter: drop-shadow(0 15px 10px rgba(0,0,0,0.6));
      z-index: 1000;
      position: relative;
    }
    
    @keyframes dropSnap {
      0% { transform: scale(1.3); }
      40% { transform: scale(0.85); }
      100% { transform: scale(1); }
    }
    img.piece.animate-drop {
      animation: dropSnap 0.2s ease-out;
    }

    .legal-dot {
      width: 25%;
      height: 25%;
      background: rgba(0,0,0,0.2);
      border-radius: 50%;
      position: absolute;
      pointer-events: none;
      z-index: 500;
    }
    .legal-dot.capture {
      width: 80%;
      height: 80%;
      background: transparent;
      border: 6px solid rgba(0,0,0,0.2);
    }

    /* Game Juice Animations */
    .board-sq.last-move {
      background: rgba(255, 255, 0, 0.4) !important;
      box-shadow: inset 0 0 15px rgba(255,215,0,0.5);
    }
    
    @keyframes screenShake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
    .board-shake { animation: screenShake 0.3s; }
    .shake-delay-1 { animation: screenShake 0.3s 0.05s; }
    .shake-delay-2 { animation: screenShake 0.3s 0.1s; }

    /* Bottom HUD */
    .hud-bottom {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
    }

    /* Pause Menu Overlay */
    #pause-menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #pause-menu.active {
      opacity: 1;
      pointer-events: auto;
    }
    .pause-box {
      background: #2e2e4f;
      border: 4px solid #fff;
      border-radius: 20px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #pause-menu.active .pause-box {
      transform: scale(1);
    }

    @keyframes pulse-hint {
      0% { box-shadow: inset 0 0 10px #ffea00; background-color: rgba(255,234,0,0.2); }

          <div id="endgame-diff" style="color: #38f9d7; font-size: 20px; font-weight: bold; margin-top: 5px; text-shadow: 0 2px 6px rgba(0,0,0,0.5);">+25</div>

  <script>
    // Initialize Playgama SDK
    bridge.initialize()
      .then(() => {
        console.log("Playgama Bridge SDK initialized successfully.");
        
        // Listen to audio changes
        bridge.platform.on(bridge.EVENT_NAME.AUDIO_STATE_CHANGED, isEnabled => {
          audioOn = isEnabled;
          if (!audioOn) {
            setAdAudioMute(true);
          } else if (!isAdPlaying) {
            setAdAudioMute(false);
          }
          updateAudioUI();
        });

        // Listen to pause changes
        bridge.platform.on(bridge.EVENT_NAME.PAUSE_STATE_CHANGED, isPaused => {
          const pm = document.getElementById('pause-menu');
          if (isPaused) {
            setAdAudioMute(true);
            if (pm && !pm.classList.contains('active')) {
              pm.classList.add('active');
              clearInterval(clockInterval);
            }
          } else {
            if (!isAdPlaying) {
              setAdAudioMute(false);
            }
            if (pm && pm.classList.contains('active')) {
              pm.classList.remove('active');
              if (bulletModeActive) {
                startClocks();
              }
            }
          }
        });

        // Apply initial audio state
        if (bridge.platform.isAudioEnabled === false) {
          audioOn = false;
        }

        // Initialize user after SDK is ready
        initUser();
        applyDebugMode();
      })
      .catch(error => {
        console.error("Playgama Bridge SDK initialization failed:", error);
        initUser();
        applyDebugMode();
      });

    // ==========================================
    // DEBUG & TESTING MODE CONTROLLER
    // ==========================================
    let isDebugMode = (
      window.location.search.includes('debug=true') || 
      window.location.hash.includes('debug') ||
      localStorage.getItem('chess_debug') === 'true'
    );

    let logoClickCount = 0;
    let logoClickTimer = null;
    function handleLogoClick() {
      logoClickCount++;
      clearTimeout(logoClickTimer);
      logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 1500);

      if (logoClickCount >= 5) {
        logoClickCount = 0;
        isDebugMode = !isDebugMode;
        if (isDebugMode) {
          localStorage.setItem('chess_debug', 'true');
          alert("🛠️ Debug Mode ENABLED! (Test buttons are now visible in matches)");
        } else {
          localStorage.removeItem('chess_debug');
          alert("🔒 Debug Mode DISABLED. (Clean production UI)");
        }
        applyDebugMode();
      }
    }

    function applyDebugMode() {
      const winBtn = document.getElementById('btn-test-win');
      if (winBtn) {
        winBtn.style.display = isDebugMode ? 'block' : 'none';
      }
    }

    // Console Debug Helpers (accessible via F12 console)
    window.debugSetWins = function(n) {
      userProfile.wins = n;
      bridge.storage.set(['chess_user'], [JSON.stringify(userProfile)]);
      const countEl = document.getElementById('skin-wins-count');
      if (countEl) countEl.innerText = n;
      renderSkinList();
      console.log(`✅ Set wins to ${n}`);
    };
    window.debugSetRating = function(elo) {
      userProfile.rating = elo;
      bridge.storage.set(['chess_user'], [JSON.stringify(userProfile)]);
      document.getElementById('user-rating-bottom').innerHTML = formatRating(elo);
      console.log(`✅ Set rating to ${elo}`);
    };
    window.debugUnlockAll = function() {
      userProfile.unlockedSkins = [
        ...SKIN_DATA.pieces.map(p => p.id),
        ...SKIN_DATA.boards.map(b => b.id)
      ];
      bridge.storage.set(['chess_user'], [JSON.stringify(userProfile)]);
      renderSkinList();
      console.log("✅ All skins unlocked!");
    };
    window.debugResetData = function() {
      localStorage.clear();
      bridge.storage.delete(['chess_user', 'chess_leaderboard']);
      location.reload();
    };
    window.debugToggle = function() {
      isDebugMode = !isDebugMode;
      if (isDebugMode) localStorage.setItem('chess_debug', 'true');
      else localStorage.removeItem('chess_debug');
      applyDebugMode();
      console.log("Debug Mode is now:", isDebugMode);
    };

    // Audio Manager & Ad Audio Controller
    const audioMove = new Audio('/sound/standard/Move.mp3');
    const audioCapture = new Audio('/sound/standard/Capture.mp3');
    
    let isAdPlaying = false;
    function setAdAudioMute(isMuted) {
      isAdPlaying = isMuted;
      if (isMuted) {
        if (audioCtx && audioCtx.state !== 'closed' && audioCtx.state !== 'suspended') {
          audioCtx.suspend().catch(() => {});
        }
        if (typeof audioMove !== 'undefined') audioMove.pause();
        if (typeof audioCapture !== 'undefined') audioCapture.pause();
      } else {
        if (audioOn && audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
      }
    }

    function playPieceMoveSound(isCapture) {
      if (!audioOn || isAdPlaying) return;
      if (isCapture && typeof audioCapture !== 'undefined') {
        audioCapture.currentTime = 0;
        audioCapture.play().catch(() => {});
      } else if (typeof audioMove !== 'undefined') {
        audioMove.currentTime = 0;
        audioMove.play().catch(() => {});
      }
    }

    // Ticking audio generator
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTick() {
      if (!audioOn || isAdPlaying) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(800 + Math.random()*200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function playBuzzer() {
      if (!audioOn || isAdPlaying) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    // Synthesized Crisp Button Click Sound
    function playClickSound() {
      if (!audioOn || isAdPlaying) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function playConfettiPop() {
      if (!audioOn || isAdPlaying) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const t = audioCtx.currentTime;
      
      // 1. The "POP" (fast downward sweep)
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
      
      oscGain.gain.setValueAtTime(1, t);
      oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
      
      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.2);
      
      // 2. The "PAPER RUSTLE" (Filtered white noise burst)
      const bufferSize = audioCtx.sampleRate * 1.5; 
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      
      const noiseSource = audioCtx.createBufferSource();
      noiseSource.buffer = buffer;
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1200;
      filter.Q.value = 0.5;
      
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(1, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 1.2);
      
      noiseSource.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      
      noiseSource.start(t);
      noiseSource.stop(t + 1.5);
    }

    function playRankUpRumble() {
      if (!audioOn || isAdPlaying) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(30, t);
      osc.frequency.linearRampToValueAtTime(50, t + 1.5);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.5, t + 0.5);
      gain.gain.linearRampToValueAtTime(0.0, t + 1.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 1.5);
    }

    function playRankUpExplosion() {
      if (!audioOn || isAdPlaying) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const bufferSize = audioCtx.sampleRate * 2.0; 
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noiseSource = audioCtx.createBufferSource();
      noiseSource.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(100, t);
      filter.frequency.exponentialRampToValueAtTime(800, t + 0.1);
      filter.frequency.exponentialRampToValueAtTime(50, t + 2);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(1, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 2);
      noiseSource.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noiseSource.start(t);
      noiseSource.stop(t + 2);
      
      // Fanfare chord
      const freqs = [440, 554.37, 659.25, 880]; // A Major
      freqs.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        oscGain.gain.setValueAtTime(0, t);
        oscGain.gain.linearRampToValueAtTime(0.1, t + 0.05);
        oscGain.gain.exponentialRampToValueAtTime(0.001, t + 2);
        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 2);
      });
    }

    // Bind click sound to all buttons and selectors globally
    document.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.classList.contains('audio-toggle')) {
        playClickSound();
      }
    });

    // Unblock & trigger TTS on first click
    document.addEventListener('click', () => {

        const u = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(u);
      }
    }, { once: true });

    let lastHeartbeatTime = 0;
    function playHeartbeat() {
      if (!audioOn) return;
      const now = Date.now();
      if (now - lastHeartbeatTime < 1000) return;
      lastHeartbeatTime = now;
      
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(65, audioCtx.currentTime);
      gain1.gain.setValueAtTime(0.9, audioCtx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start();
      osc1.stop(audioCtx.currentTime + 0.18);
      
      setTimeout(() => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(55, audioCtx.currentTime);
        gain2.gain.setValueAtTime(0.7, audioCtx.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start();
        osc2.stop(audioCtx.currentTime + 0.18);
      }, 150);
    }

    // Streak Manager
    let currentStreak = 0;
    function handleCaptureStreak(isCapture) {
      if (!audioOn) return;
      if (isCapture) {
        currentStreak++;
        let msg = null;
        if (currentStreak === 1) msg = "Capture!";
        else if (currentStreak === 2) msg = "Double Strike!";
        else if (currentStreak >= 3) msg = "Dominating!";
        
        if (msg && window.speechSynthesis) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(msg);
          utterance.rate = 1.0;
          utterance.volume = 1.0;
          if (window.speechSynthesis.getVoices) {
            const voices = window.speechSynthesis.getVoices();
            const maleVoice = voices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('uk english male') || v.name.toLowerCase().includes('david'));
            if (maleVoice) utterance.voice = maleVoice;
          }
          window.speechSynthesis.speak(utterance);
        }
      } else {
        currentStreak = 0;
      }
    }

    function isSkinUnlocked(type, skin) {
      if (!skin || skin.winsReq === 0 || skin.id === 'classic') return true;
      if ((userProfile.wins || 0) >= skin.winsReq) return true;
      if (userProfile.unlockedSkins && userProfile.unlockedSkins.includes(skin.id)) return true;
      return false;
    }

    function unlockSkinWithAd(type, skinId) {
      requestReward(`skin_${type}_${skinId}`);
    }
    
    function grantReward(placement) {
      if (placement === 'extra_time') {
        userTimeLeft += 30;
        updateClockDisplay();
        togglePause();
      } else if (placement === 'hint') {
        hintsUsed++;
        hintEngine.postMessage('position fen ' + game.fen());
        hintEngine.postMessage('go depth 10');
        togglePause();
      } else if (placement === 'undo_move') {
        engine.postMessage('stop');
        game.undo(); 
        if (game.turn() !== 'w') { // Assuming user is always white (default in this game)
           game.undo();
        }
        lastMoveSqs = [];
        renderBoard('main-board');
        togglePause();
      } else if (placement && placement.startsWith('skin_')) {
        const parts = placement.split('_');
        const type = parts[1]; // 'boardTheme' or 'pieceSet'
        const skinId = parts.slice(2).join('_');

        const list = (type === 'boardTheme') ? SKIN_DATA.boards : SKIN_DATA.pieces;
        const skin = list.find(s => s.id === skinId);
        if (!skin) return;

        const adsReq = skin.adsReq || (skin.winsReq <= 10 ? 2 : 3);
        userProfile.skinAdProgress = userProfile.skinAdProgress || {};
        userProfile.skinAdProgress[skinId] = (userProfile.skinAdProgress[skinId] || 0) + 1;

        if (userProfile.skinAdProgress[skinId] >= adsReq) {
          userProfile.unlockedSkins = userProfile.unlockedSkins || ['classic'];
          if (!userProfile.unlockedSkins.includes(skinId)) {
            userProfile.unlockedSkins.push(skinId);
          }
          userProfile[type] = skinId; // Auto-select newly unlocked skin

          // Celebration confetti
          if (typeof confetti !== 'undefined') {
            confetti({
              particleCount: 60,
              spread: 70,
              origin: { y: 0.6 }
            });
          }
        }

        bridge.storage.set(['chess_user'], [JSON.stringify(userProfile)]);
        renderSkinList();
        renderBoard('main-board');
      }
    }

    function initUser() {
      // Configure Interstitial Pacing and Rewarded Ads logic
      if (typeof bridge !== 'undefined' && bridge.advertisement) {
        bridge.advertisement.setMinimumDelayBetweenInterstitial(120);

        bridge.advertisement.on(bridge.EVENT_NAME.INTERSTITIAL_STATE_CHANGED, state => {
          if (state === 'opened' || state === 'loading') {
            setAdAudioMute(true);
          } else if (state === 'closed' || state === 'failed') {
            setAdAudioMute(false);
          }
        });
        
        bridge.advertisement.on(bridge.EVENT_NAME.REWARDED_STATE_CHANGED, state => {
          if (state === 'opened' || state === 'loading') {
            setAdAudioMute(true);
          } else if (state === 'closed' || state === 'failed') {
            setAdAudioMute(false);
          } else if (state === 'rewarded') {
            setAdAudioMute(false);
            const placement = currentRequestedPlacement || bridge.advertisement.rewardedPlacement;
            if (placement) {
              grantReward(placement);
              currentRequestedPlacement = null;
            }
          }
        });
      }

      bridge.storage.get(['chess_user', 'chess_leaderboard'])
        .then(data => {
          const storedUser = data[0];
          const storedLeaderboard = data[1];

          if (storedUser) {
            userProfile = JSON.parse(storedUser);
            if (userProfile.wins === undefined) userProfile.wins = 0;
            if (!userProfile.pieceSet) userProfile.pieceSet = 'classic';
            if (!userProfile.boardTheme) userProfile.boardTheme = 'classic';
            if (!userProfile.unlockedSkins) userProfile.unlockedSkins = ['classic'];
            if (!userProfile.skinAdProgress) userProfile.skinAdProgress = {};
          } else {
            userProfile.name = 'Anonymous ' + Math.floor(1000 + Math.random() * 9000);
            userProfile.rating = 800;
            userProfile.wins = 0;
            userProfile.pieceSet = 'classic';
            userProfile.boardTheme = 'classic';
            userProfile.unlockedSkins = ['classic'];
            userProfile.skinAdProgress = {};
            bridge.storage.set(['chess_user'], [JSON.stringify(userProfile)]);
          }

          if (storedLeaderboard) {
            cachedLeaderboard = JSON.parse(storedLeaderboard);
          } else {
            cachedLeaderboard = generateFakePlayers();
            bridge.storage.set(['chess_leaderboard'], [JSON.stringify(cachedLeaderboard)]);
          }

          document.getElementById('user-name-bottom').innerText = userProfile.name;
          document.getElementById('user-rating-bottom').innerHTML = formatRating(userProfile.rating);
          renderLeaderboard();

          // Send game_ready message when first playable frame is ready
          bridge.platform.sendMessage("game_ready");
        })
        .catch(error => {
          console.error("Storage loading failed:", error);
          userProfile.name = 'Anonymous ' + Math.floor(1000 + Math.random() * 9000);
          userProfile.rating = 800;
          cachedLeaderboard = generateFakePlayers();
          document.getElementById('user-name-bottom').innerText = userProfile.name;
          document.getElementById('user-rating-bottom').innerHTML = formatRating(userProfile.rating);
          renderLeaderboard();
          bridge.platform.sendMessage("game_ready");
        });

    function renderLeaderboard() {
      const lbContainer = document.getElementById('lb-list-container');

      let list = allPlayers.filter(p => p.name !== userProfile.name);
      list.push({ name: userProfile.name, score: userProfile.rating, isUser: true });
      
      list.sort((a,b) => b.score - a.score);
      
      const userRank = list.findIndex(p => p.isUser) + 1;
      
      let html = '';
      const displayCount = Math.min(10, list.length);
      for (let i = 0; i < displayCount; i++) {
        const p = list[i];
        const bg = p.isUser ? 'background: rgba(79, 172, 254, 0.2); border: 1px solid #4facfe;' : '';
        html += `<div class="lb-item" style="${bg}"><span>${i+1}. ${p.name}</span><span class="lb-score">${formatRating(p.score)}</span></div>`;
      }
      
      if (userRank > 10) {
        html += `<div style="text-align: center; color: rgba(255,255,255,0.4); font-weight: bold; margin: 4px 0;">...</div>`;
        html += `<div class="lb-item" style="background: rgba(79, 172, 254, 0.2); border: 1px solid #4facfe;"><span>${userRank}. ${userProfile.name}</span><span class="lb-score">${formatRating(userProfile.rating)}</span></div>`;

    // Screen Management
    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      if (screenId === 'game-screen') {
        applyDebugMode();
      }

      // Control Banner Ad depending on screen
      if (typeof bridge !== 'undefined' && bridge.advertisement && bridge.advertisement.isBannerSupported) {
        if (screenId === 'menu-screen') {
          bridge.advertisement.showBanner();
        } else {
          bridge.advertisement.hideBanner();
        }
      }
    }

    function initClocks() {
      clearInterval(clockInterval);
      document.getElementById('opp-timer').style.display = bulletModeActive ? 'block' : 'none';
      document.getElementById('user-timer').style.display = bulletModeActive ? 'block' : 'none';
      
      if (!bulletModeActive) return;
      
      userTimeLeft = 60;
      oppTimeLeft = 60;
      updateClockDisplay();
      startClocks();
    }

    function startClocks() {
      clearInterval(clockInterval);
      clockInterval = setInterval(() => {
        if (game.game_over()) {
          clearInterval(clockInterval);
          return;
        }
        if (game.turn() === 'w') {
          userTimeLeft--;
          if (userTimeLeft <= 10 && userTimeLeft > 0) {
            playHeartbeat();
          }
          if (userTimeLeft <= 0) {
            clearInterval(clockInterval);
            endFakeGame('loss');
          }
        } else {
          oppTimeLeft--;
          if (oppTimeLeft <= 0) {
            clearInterval(clockInterval);
            endFakeGame('win');
          }
        }
        updateClockDisplay();
      }, 1000);
    }

    function updateClockDisplay() {
      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };
      document.getElementById('user-timer').innerText = formatTime(userTimeLeft);
      document.getElementById('opp-timer').innerText = formatTime(oppTimeLeft);
      
      document.getElementById('user-timer').style.borderColor = userTimeLeft <= 10 ? '#ff4757' : '#38f9d7';
      document.getElementById('user-timer').style.color = userTimeLeft <= 10 ? '#ff4757' : '#38f9d7';
      if (userTimeLeft <= 10) {
         document.getElementById('user-timer').style.textShadow = '0 0 10px rgba(255,71,87,0.8)';
      } else {
         document.getElementById('user-timer').style.textShadow = '0 0 10px rgba(56,249,215,0.5)';
      }
    }

    let game = new Chess();
    let currentOpponentRating = 1200;
    let currentGameMode = '';

    function configureEngine(targetElo) {
      engine.postMessage('setoption name UCI_LimitStrength value true');
      engine.postMessage('setoption name UCI_Elo value ' + Math.min(2850, Math.max(1350, targetElo)));
    }

    const puzzleList = [
      { fen: "6k1/5ppp/8/8/8/8/5PPP/4R1K1 w - - 0 1", moves: ["e1e8"] },
      { fen: "r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4", moves: ["h5f7"] },
      { fen: "r1b1k2r/pppp1ppp/8/4n3/1bPq4/P7/1P1BPPPP/RN1QKB1R b KQkq - 0 1", moves: ["e5d3", "e2d3", "b4d2", "d1d2"] }
    ];
    let currentPuzzle = null;
    let puzzleMoveIndex = 0;

    function startGame(mode) {
      game.reset();
      lastMoveSqs = [];
      selectedPieceSq = null;
      lastActiveGameMode = mode;
      updateMoveHistory();
      currentGameMode = mode;
      currentPuzzle = null;
      hintsUsed = 0;

      if (typeof bridge !== 'undefined' && bridge.platform && typeof bridge.platform.sendMessage === 'function') {
        bridge.platform.sendMessage("level_started");
      }
      
      if (mode === 'puzzles') {
        const randPuzzle = puzzleList[Math.floor(Math.random() * puzzleList.length)];
        currentPuzzle = randPuzzle;
        puzzleMoveIndex = 0;
        game.load(randPuzzle.fen);
        document.getElementById('opp-name-top').innerText = 'Puzzle Trainer';
        document.getElementById('opp-rating-top').innerText = 'Tactics';
        switchScreen('game-screen');
        setTimeout(() => renderBoard('main-board'), 100);
        document.getElementById('opp-timer').style.display = 'none';
        document.getElementById('user-timer').style.display = 'none';
        return;
      }
      
      if (mode === 'online') {
        startFakeMultiplayer();
      } else if (mode.startsWith('bot_')) {
        let oppName = 'Bot';
        let diff = 0;
        
        if (mode === 'bot_easy') {
          oppName = 'Beginner Bot';
          diff = -200;
        } else if (mode === 'bot_medium') {
          oppName = 'Club Bot';
          diff = 0;
        } else if (mode === 'bot_hard') {
          oppName = 'Master Bot';
          diff = +400;
        }
        
        currentOpponentRating = Math.max(800, userProfile.rating + diff);
        document.getElementById('opp-name-top').innerText = oppName;
        document.getElementById('opp-rating-top').innerHTML = formatRating(currentOpponentRating);
        
        configureEngine(currentOpponentRating);
        
        switchScreen('game-screen');
        setTimeout(() => renderBoard('main-board'), 100);
        initClocks();
      }

    function startFakeMultiplayer() {
      document.getElementById('pairing-screen').classList.remove('zoom-out-fade');
      switchScreen('pairing-screen');
      
      document.getElementById('pairing-status').innerText = 'Searching for Opponent...';
      document.getElementById('pairing-spinner').style.display = 'block';
      document.getElementById('pairing-match').style.display = 'none';

      // 1.0 seconds search
      setTimeout(() => {
        const oppName = 'Anonymous ' + Math.floor(1000 + Math.random() * 9000);
        const oppRating = userProfile.rating + Math.floor(Math.random() * 100) - 50;
        currentOpponentRating = oppRating;
        
        configureEngine(currentOpponentRating);
        
        document.getElementById('pairing-status').innerText = 'Match Found!';
        document.getElementById('pairing-spinner').style.display = 'none';
        document.getElementById('pairing-match').style.display = 'flex';

        // 0.5s match found display -> zoom transition

          const ps = document.getElementById('pairing-screen');

          setTimeout(() => {
            switchScreen('game-screen');
            ps.classList.remove('zoom-out-fade');

            initClocks();
          }, 400);
        }, 500);

      }, 1000);

    function endFakeGame(result) {
      const diff = currentOpponentRating - userProfile.rating;
      let winReward = 25;
      let lossPenalty = 20;
      
      if (currentGameMode === 'bot_easy') {
        winReward = 10;
        lossPenalty = 25;
      } else if (currentGameMode === 'bot_medium') {
        winReward = 25;
        lossPenalty = 20;
      } else if (currentGameMode === 'bot_hard') {
        winReward = 40;
        lossPenalty = 10;
      } else if (currentGameMode === 'online') {
        winReward = Math.max(10, 25 + Math.floor(diff / 20));
        lossPenalty = Math.max(10, 20 - Math.floor(diff / 20));
      } else if (currentGameMode === 'puzzles') {
        winReward = 0;
        lossPenalty = 0; // No penalty for failing a puzzle
      }

      if (bulletModeActive) {
        winReward = Math.floor(winReward * 1.5);
      }

      clearInterval(clockInterval);
      const oldRating = userProfile.rating;
        // Determine rating change
        let change = 0;
        if (result === 'win') {
          userProfile.rating += winReward;
          userProfile.wins = (userProfile.wins || 0) + 1;
          bridge.storage.set(['chess_user'], [JSON.stringify(userProfile)]);
          change = winReward;
        } else {
          userProfile.rating = Math.max(0, oldRating - lossPenalty);
          change = -lossPenalty;
        }
      
      const newRating = userProfile.rating;
      const diffStr = (change > 0 ? '+' : '') + change;
      
      // Save and re-render
      bridge.storage.set(['chess_user'], [JSON.stringify(userProfile)]);
      document.getElementById('user-rating-bottom').innerHTML = formatRating(userProfile.rating);
      renderLeaderboard();
      
      const oldTier = getTier(oldRating);
      const newTier = getTier(newRating);
      
      // Show interstitial ad on game over
      if (typeof bridge !== 'undefined' && bridge.advertisement && bridge.advertisement.isInterstitialSupported) {
        bridge.advertisement.showInterstitial();
      }

      if (typeof bridge !== 'undefined' && bridge.platform && typeof bridge.platform.sendMessage === 'function') {
        bridge.platform.sendMessage(result === 'win' ? "level_completed" : "level_failed");
      }

      if (result === 'win' && newTier.name !== oldTier.name) {
        triggerRankUpAnimation(newTier, () => {
          showEndgameModal(result, oldRating, newRating, diffStr);
        });
      } else {
        showEndgameModal(result, oldRating, newRating, diffStr);
      }
    }

    function triggerRankUpAnimation(tier, callback) {
      const overlay = document.getElementById('rankup-overlay');
      const stone = document.getElementById('rankup-stone');
      const badge = document.getElementById('rankup-badge');
      const text = document.getElementById('rankup-text');
      const tierText = document.getElementById('rankup-tier-text');
      
      badge.innerHTML = `<img src="images/tiers/${tier.img}" style="width: 160px; height: 160px; object-fit: contain;">`;
      tierText.innerText = tier.name + ' Tier';
      tierText.style.color = tier.color;
      
      overlay.style.display = 'flex';
      
      // Reset animations
      stone.style.transform = 'scale(1)';
      stone.style.opacity = '1';
      stone.style.display = 'block';
      badge.style.opacity = '0';
      badge.style.transform = 'scale(0.1)';
      text.style.opacity = '0';
      tierText.style.opacity = '0';
      
      // Rumble
      playRankUpRumble();
      
      let shakes = 0;
      const shakeInterval = setInterval(() => {
        shakes++;
        const x = (Math.random() - 0.5) * 20;
        const y = (Math.random() - 0.5) * 20;
        stone.style.transform = `translate(${x}px, ${y}px) scale(1.1)`;
        if (shakes > 30) {
           clearInterval(shakeInterval);
           stone.style.display = 'none';
        }
      }, 50);
      
      setTimeout(() => {
        // Explosion & Reveal
        playRankUpExplosion();
        stone.style.opacity = '0';
        badge.style.opacity = '1';
        badge.style.transform = 'scale(1.2)';
        
        setTimeout(() => { badge.style.transform = 'scale(1)'; }, 300);
        
        text.style.opacity = '1';
        tierText.style.opacity = '1';
        
        setTimeout(() => {
          overlay.style.opacity = '0';
          setTimeout(() => {
            overlay.style.display = 'none';
            overlay.style.opacity = '1';
            callback();
          }, 500);
        }, 3500);
      }, 1500);
    }

    function showEndgameModal(result, oldRating, newRating, diffStr) {
      const modal = document.getElementById('endgame-modal');
      const title = document.getElementById('endgame-title');
      const elo = document.getElementById('endgame-elo');
      const diffLabel = document.getElementById('endgame-diff');
      const ratingLabel = document.getElementById('endgame-rating-label');
      const rematchBtn = document.getElementById('btn-rematch');
      
      title.innerText = result === 'win' ? 'VICTORY' : 'DEFEAT';
      title.style.color = result === 'win' ? '#ffd700' : '#ff4757';
      elo.innerText = newRating;
      diffLabel.innerText = diffStr;
      diffLabel.style.color = result === 'win' ? '#38f9d7' : '#ff4757';
      
      if (currentGameMode !== 'puzzles') {
        rematchBtn.style.display = 'block';
        elo.style.display = 'block';
        diffLabel.style.display = 'block';
        if(ratingLabel) ratingLabel.style.display = 'block';
      } else {
        rematchBtn.style.display = 'none';
        elo.style.display = 'none';
        diffLabel.style.display = 'none';
        if(ratingLabel) ratingLabel.style.display = 'none';
      }
      
      modal.style.display = 'flex';
      
      if (result === 'win' && typeof confetti !== 'undefined') {
        window.confettiActive = true;
        const duration = 3000;
        const end = Date.now() + duration;

        (function frame() {
          if (!window.confettiActive) return;
          confetti({
            particleCount: 8,
            angle: 60,
            spread: 55,
            origin: { x: 0, y: 0.6 },
            colors: ['#ffd700', '#ff4757', '#00f2fe', '#38f9d7'],
            zIndex: 10000
          });
          confetti({
            particleCount: 8,
            angle: 120,
            spread: 55,
            origin: { x: 1, y: 0.6 },
            colors: ['#ffd700', '#ff4757', '#00f2fe', '#38f9d7'],
            zIndex: 10000
          });

          if (Date.now() < end && window.confettiActive) {
            requestAnimationFrame(frame);
          }
        }());
        
        playConfettiPop();
      }
      
      // Animate ELO
      let currentDisplayRating = oldRating;
      const ticks = 30; // Number of animation frames
      const ratingStep = (newRating - oldRating) / ticks;
      let frame = 0;
      
      function tickAnimation() {
        if (frame < ticks) {
          currentDisplayRating += ratingStep;
          elo.innerHTML = formatRating(Math.round(currentDisplayRating));
          playTick();
          frame++;
          requestAnimationFrame(tickAnimation);
        } else {
          elo.innerHTML = formatRating(newRating);
        }
      }
      
      setTimeout(() => requestAnimationFrame(tickAnimation), 500); // short delay
    }

    let selectedPieceSq = null;
    let lastMoveSqs = [];

    function handleSquareClick(sq, imgEl) {
      if (selectedPieceSq) {
        const success = attemptMove(selectedPieceSq, sq);
        if (!success && game.get(sq) && game.get(sq).color === 'w') {
          selectedPieceSq = sq;
          renderBoard('main-board');
        } else {
          selectedPieceSq = null;
          renderBoard('main-board');
        }
      } else {
        const piece = game.get(sq);
        if (piece && piece.color === 'w') {
          selectedPieceSq = sq;
          renderBoard('main-board');
        }
      }
    }

    function attemptMove(fromSq, toSq) {
      if (currentPuzzle) {
        const attemptStr = fromSq + toSq;
        const expectedMoveStr = currentPuzzle.moves[puzzleMoveIndex];
        
        if (expectedMoveStr && expectedMoveStr.startsWith(attemptStr)) {
          const move = game.move({ from: fromSq, to: toSq, promotion: 'q' });
          if (move) {
            puzzleMoveIndex++;
            lastMoveSqs = [fromSq, toSq];
            renderBoard('main-board');
            updateMoveHistory();
            if (audioOn && typeof audioMove !== 'undefined') {
               audioMove.currentTime = 0;
               audioMove.play().catch(e=>console.log(e));
            }
            if (puzzleMoveIndex >= currentPuzzle.moves.length) {
              setTimeout(() => endFakeGame('win'), 500);
            } else {
              // Bot's forced reply
              setTimeout(() => {
                const replyStr = currentPuzzle.moves[puzzleMoveIndex];
                const rFrom = replyStr.substring(0, 2);
                const rTo = replyStr.substring(2, 4);
                game.move({ from: rFrom, to: rTo, promotion: 'q' });
                puzzleMoveIndex++;
                lastMoveSqs = [rFrom, rTo];
                renderBoard('main-board');
                updateMoveHistory();
                if (audioOn && typeof audioMove !== 'undefined') {
                   audioMove.currentTime = 0;
                   audioMove.play().catch(e=>console.log(e));
                }
                if (puzzleMoveIndex >= currentPuzzle.moves.length) {
                  setTimeout(() => endFakeGame('win'), 500);
                }
              }, 400);
            }
            return true;
          }
        }
        
        // Prevent shake if user is just selecting another piece of their own color
        const targetPiece = game.get(toSq);
        if (targetPiece && targetPiece.color === game.get(fromSq).color) {
          return false;
        }
        
        // Incorrect move
        const b = document.getElementById('main-board');
        if(b) { b.classList.remove('board-shake'); void b.offsetWidth; b.classList.add('board-shake'); }
        return false;
      }

      let isCapture = false;
      const targetPiece = game.get(toSq);
      if (targetPiece && targetPiece.color !== game.get(fromSq).color) {
        isCapture = true;
      }
      
      const move = game.move({
        from: fromSq,
        to: toSq,
        promotion: 'q'
      });

      if (move) {
        if (audioOn) {
          if (move.captured || isCapture) {
             audioCapture.currentTime = 0;
             audioCapture.play().catch(e=>console.log(e));
          } else {
             audioMove.currentTime = 0;
             audioMove.play().catch(e=>console.log(e));
          }
        }
        if (game.turn() === 'b') { // User just moved (white)
           handleCaptureStreak(move.captured || isCapture);
        }
        if (move.captured || isCapture) {
          const els = document.querySelectorAll('button, .audio-toggle, .player-hud');
          const b = document.getElementById('main-board');
          if(b) { b.classList.remove('board-shake'); void b.offsetWidth; b.classList.add('board-shake'); }
          els.forEach(el => {
             el.classList.remove('shake-delay-1', 'shake-delay-2');
             void el.offsetWidth;
             el.classList.add(Math.random() > 0.5 ? 'shake-delay-1' : 'shake-delay-2');
          });
        }
        
        renderBoard('main-board');
        updateMoveHistory();
        checkGameOver();
        
        if (!game.game_over()) {
          setTimeout(makeBotMove, 400);
        }
        return true;
      }
      return false;
    }

    let engineReady = false;
    let engine = new Worker('/npm/stockfish.js/stockfish.js');
    let hintEngine = new Worker('/npm/stockfish.js/stockfish.js');
    let hintsUsed = 0;
    
    hintEngine.onmessage = function(event) {
      const line = event.data;
      if (line.startsWith('bestmove')) {
        const parts = line.split(' ');
        const moveStr = parts[1];
        if (moveStr && moveStr !== '(none)') {
          const source = moveStr.substring(0, 2);
          const target = moveStr.substring(2, 4);
          
          const el1 = document.getElementById('sq-' + source);
          const el2 = document.getElementById('sq-' + target);
          if (el1) el1.classList.add('hint-glow');
          if (el2) el2.classList.add('hint-glow');
          
          setTimeout(() => {
            const clear1 = document.getElementById('sq-' + source);
            const clear2 = document.getElementById('sq-' + target);
            if (clear1) clear1.classList.remove('hint-glow');
            if (clear2) clear2.classList.remove('hint-glow');
          }, 3000);
        }
      }
    };
    
    engine.onmessage = function(event) {
      const line = event.data;
      if (line === 'uciok') {
        engineReady = true;
      } else if (line.startsWith('bestmove')) {
        const parts = line.split(' ');
        const moveStr = parts[1];
        
        if (moveStr && moveStr !== '(none)') {
          const source = moveStr.substring(0, 2);
          const target = moveStr.substring(2, 4);
          const promotion = moveStr.length > 4 ? moveStr.charAt(4) : 'q';
          
          let isCapture = false;
          const targetPiece = game.get(target);
          if (targetPiece) isCapture = true;
          
          const move = game.move({
            from: source,
            to: target,
            promotion: promotion
          });
          
          if (move) {
             if (audioOn) {
                if (move.captured || isCapture) {
                   audioCapture.currentTime = 0;
                   audioCapture.play().catch(e=>console.log(e));
                } else {
                   audioMove.currentTime = 0;
                   audioMove.play().catch(e=>console.log(e));
                }
             }
             if (game.turn() === 'w') { // Bot just moved (black)
                handleCaptureStreak(move.captured || isCapture);
             }
             lastMoveSqs = [source, target];
             if (move.captured || isCapture) {
                const els = document.querySelectorAll('button, .audio-toggle, .player-hud');
                const b = document.getElementById('main-board');
                if(b) { b.classList.remove('board-shake'); void b.offsetWidth; b.classList.add('board-shake'); }
                els.forEach(el => {
                   el.classList.remove('shake-delay-1', 'shake-delay-2');
                   void el.offsetWidth;
                   el.classList.add(Math.random() > 0.5 ? 'shake-delay-1' : 'shake-delay-2');
                });
             }
          }
          
          renderBoard('main-board');
          updateMoveHistory();
          checkGameOver();
        }
      }
    };
    
    engine.postMessage('uci');
    engine.postMessage('ucinewgame');

    function makeBotMove() {
      if (!engineReady) {
        setTimeout(makeBotMove, 500);
        return;
      }
      
      const history = game.history({ verbose: true });
      let moves = '';
      if (history.length > 0) {
        moves = ' moves ' + history.map(m => m.from + m.to + (m.promotion ? m.promotion : '')).join(' ');
      }
      
      engine.postMessage('position startpos' + moves);
      engine.postMessage('go depth 10');
    }

    function checkGameOver() {
      if (game.game_over()) {
        setTimeout(() => {
          if (game.in_checkmate()) {
            if (game.turn() === 'w') {
              endFakeGame('loss'); 
            } else {
              endFakeGame('win');
            }
          } else {
            alert('Game Over: Draw');
            returnToMenu();
          }
        }, 500);
      }
    }

    function updateMoveHistory() {
      const histContainer = document.querySelector('.move-list');
      if (!histContainer) return;
      
      const history = game.history();
      let html = '';
      for (let i = 0; i < history.length; i += 2) {
        const moveNum = Math.floor(i / 2) + 1;
        const wMove = history[i];
        const bMove = history[i+1] || '';
        html += `<div class="move-row"><span class="move-num">${moveNum}.</span><span class="move-white">${wMove}</span><span class="move-black">${bMove}</span></div>`;
      }
      histContainer.innerHTML = html;
      histContainer.scrollTop = histContainer.scrollHeight;
    }

    function renderBoard(elementId) {
      const container = document.getElementById(elementId);
      if (!container) return;
      container.innerHTML = '';
      
      const boardThemeObj = SKIN_DATA.boards.find(b => b.id === (userProfile.boardTheme || 'classic'));
      container.className = 'board-wrapper ' + (boardThemeObj ? boardThemeObj.cssClass : 'board-classic');

      const pieceMap = {
        'r': 'bR', 'n': 'bN', 'b': 'bB', 'q': 'bQ', 'k': 'bK', 'p': 'bP',
        'R': 'wR', 'N': 'wN', 'B': 'wB', 'Q': 'wQ', 'K': 'wK', 'P': 'wP'
      };

      const files = ['a','b','c','d','e','f','g','h'];
      const boardState = game.board();

      let legalMoves = [];
      if (currentGameMode === 'bot_easy' && selectedPieceSq) {
        legalMoves = game.moves({ square: selectedPieceSq, verbose: true });
      }

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement('div');
          const isLight = (r + c) % 2 === 0;
          sq.className = 'board-sq ' + (isLight ? 'light' : 'dark');
          sq.style.position = 'relative';
          
          const rank = 8 - r;
          const file = files[c];
          const sqName = file + rank;
          sq.id = 'sq-' + sqName;

          if (sqName === selectedPieceSq) {
            sq.classList.add('selected');
          }
          if (lastMoveSqs.includes(sqName)) {
            sq.classList.add('last-move');
          }

          const pObj = boardState[r][c];
          let sqImg = null;
          if (pObj) {
            const pChar = pObj.color === 'w' ? pObj.type.toUpperCase() : pObj.type;
            const currentPieceSetId = userProfile.pieceSet || 'classic';
            const pieceSkinObj = SKIN_DATA.pieces.find(p => p.id === currentPieceSetId) || SKIN_DATA.pieces[0];
            
            sqImg = document.createElement('img');
            sqImg.src = '/piece/cburnett/' + pieceMap[pChar] + '.svg';
            sqImg.className = 'piece';
            if (pieceSkinObj.cssFilter !== 'none') {
              sqImg.style.filter = pieceSkinObj.cssFilter + ' drop-shadow(0 4px 4px rgba(0,0,0,0.4))';
            }
            
            if (sqName === lastMoveSqs[1]) {
               sqImg.classList.add('animate-drop');
            }
            
            if (pObj.color === 'w') {
              sqImg.draggable = false;
              sqImg.style.cursor = 'pointer';
            } else {
              sqImg.draggable = false;
            }
            
            sq.appendChild(sqImg);
          }
          
          const legalMove = legalMoves.find(m => m.to === sqName);
          if (legalMove) {
             const dot = document.createElement('div');
             dot.className = 'legal-dot' + (pObj ? ' capture' : '');
             sq.appendChild(dot);
          }

          sq.addEventListener('click', () => handleSquareClick(sqName, sqImg));

          container.appendChild(sq);
        }
      }
    }
  </script>
</body>
</html>
