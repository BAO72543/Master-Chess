    function handleSquareClick(sq, imgEl) {
      const playerColor = currentPuzzle ? puzzlePlayerColor : 'w';
      if (selectedPieceSq) {
        const success = attemptMove(selectedPieceSq, sq);
        if (!success && game.get(sq) && game.get(sq).color === playerColor && game.turn() === playerColor) {
          selectedPieceSq = sq;
          renderBoard('main-board');
        } else {
          selectedPieceSq = null;
          renderBoard('main-board');
        }
      } else {
        const piece = game.get(sq);
        if (piece && piece.color === playerColor && game.turn() === playerColor) {
          selectedPieceSq = sq;
          renderBoard('main-board');
        }
      }
    }

    function attemptMove(fromSq, toSq) {
      const playerColor = currentPuzzle ? puzzlePlayerColor : 'w';

      if (currentPuzzle) {
        const attemptStr = fromSq + toSq;
        const expectedMoveStr = currentPuzzle.moves[puzzleMoveIndex];
        
        if (expectedMoveStr && (expectedMoveStr === attemptStr || expectedMoveStr.startsWith(attemptStr))) {
          const promo = expectedMoveStr.length > 4 ? expectedMoveStr[4] : 'q';
          const move = game.move({ from: fromSq, to: toSq, promotion: promo });
          if (move) {
            puzzleMoveIndex++;
            lastMoveSqs = [fromSq, toSq];
            playPieceMoveSound(move.captured, game.in_check());
            renderBoard('main-board');
            updateMoveHistory();
            
            if (puzzleMoveIndex >= currentPuzzle.moves.length) {
              setTimeout(() => {
                playConfettiPop();
                concludeMatch('win');
              }, 400);
            } else {
              // Bot's forced reply
              setTimeout(() => {
                const replyStr = currentPuzzle.moves[puzzleMoveIndex];
                const rFrom = replyStr.substring(0, 2);
                const rTo = replyStr.substring(2, 4);
                const rPromo = replyStr.length > 4 ? replyStr[4] : 'q';
                const rMove = game.move({ from: rFrom, to: rTo, promotion: rPromo });
                puzzleMoveIndex++;
                lastMoveSqs = [rFrom, rTo];
                playPieceMoveSound(rMove ? rMove.captured : false, game.in_check());
                renderBoard('main-board');
                updateMoveHistory();
                
                if (puzzleMoveIndex >= currentPuzzle.moves.length) {
                  setTimeout(() => {
                    playConfettiPop();
                    concludeMatch('win');
                  }, 400);
                }
              }, 400);
            }
            return true;
          }
        }
        
        // Prevent shake if user is just selecting another piece of their own color
        const targetPiece = game.get(toSq);
        if (targetPiece && targetPiece.color === playerColor) {
          return false;
        }
        
        // Incorrect move
        const b = document.getElementById('main-board');
        if (b) { b.classList.remove('board-shake'); void b.offsetWidth; b.classList.add('board-shake'); }
        playTick();
        return false;
      }

      let isCapture = false;
      const targetPiece = game.get(toSq);
      if (targetPiece && targetPiece.color !== game.get(fromSq).color) {
        isCapture = true;
      }
      
      const move = game.move({
        from: fromSq,
        to: toSq,
        promotion: 'q'
      });

      if (move) {
        playPieceMoveSound(move.captured || isCapture, game.in_check());
        if (game.turn() === 'b') { // User just moved (white)
           handleCaptureStreak(move.captured || isCapture);
        }
        if (move.captured || isCapture) {
          const els = document.querySelectorAll('button, .audio-toggle, .player-hud');
          const b = document.getElementById('main-board');
          if (b) { b.classList.remove('board-shake'); void b.offsetWidth; b.classList.add('board-shake'); }
          els.forEach(el => {
             el.classList.remove('shake-delay-1', 'shake-delay-2');
             void el.offsetWidth;
             el.classList.add(Math.random() > 0.5 ? 'shake-delay-1' : 'shake-delay-2');
          });
        }
        
        clearActiveHint();
        renderBoard('main-board');
        updateMoveHistory();
        checkGameOver();
        
        if (!game.game_over()) {
          setTimeout(makeBotMove, 400);
        }
        return true;
      }
      return false;
    }

    /**
     * Piece-Square Tables (PST) and Alpha-Beta Minimax Evaluation
     * Provides fast instant-heuristic search and serves as reliable fallback for Stockfish
     */
    const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
    const pst = {
      p: [
        0,  0,  0,  0,  0,  0,  0,  0,
        50, 50, 50, 50, 50, 50, 50, 50,
        10, 10, 20, 30, 30, 20, 10, 10,
         5,  5, 10, 25, 25, 10,  5,  5,
         0,  0,  0, 20, 20,  0,  0,  0,
         5, -5,-10,  0,  0,-10, -5,  5,
         5, 10, 10,-20,-20, 10, 10,  5,
         0,  0,  0,  0,  0,  0,  0,  0
      ],
      n: [
        -50,-40,-30,-30,-30,-30,-40,-50,
        -40,-20,  0,  0,  0,  0,-20,-40,
        -30,  0, 10, 15, 15, 10,  0,-30,
        -30,  5, 15, 20, 20, 15,  5,-30,
        -30,  0, 15, 20, 20, 15,  0,-30,
        -30,  5, 10, 15, 15, 10,  5,-30,
        -40,-20,  0,  5,  5,  0,-20,-40,
        -50,-40,-30,-30,-30,-30,-40,-50
      ],
      b: [
        -20,-10,-10,-10,-10,-10,-10,-20,
        -10,  0,  0,  0,  0,  0,  0,-10,
        -10,  0,  5, 10, 10,  5,  0,-10,
        -10,  5,  5, 10, 10,  5,  5,-10,
        -10,  0, 10, 10, 10, 10,  0,-10,
        -10, 10, 10, 10, 10, 10, 10,-10,
        -10,  5,  0,  0,  0,  0,  5,-10,
        -20,-10,-10,-10,-10,-10,-10,-20
      ],
      r: [
          0,  0,  0,  0,  0,  0,  0,  0,
          5, 10, 10, 10, 10, 10, 10,  5,
         -5,  0,  0,  0,  0,  0,  0, -5,
         -5,  0,  0,  0,  0,  0,  0, -5,
         -5,  0,  0,  0,  0,  0,  0, -5,
         -5,  0,  0,  0,  0,  0,  0, -5,
         -5,  0,  0,  0,  0,  0,  0, -5,
          0,  0,  0,  5,  5,  0,  0,  0
      ],
      q: [
        -20,-10,-10, -5, -5,-10,-10,-20,
        -10,  0,  0,  0,  0,  0,  0,-10,
        -10,  0,  5,  5,  5,  5,  0,-10,
         -5,  0,  5,  5,  5,  5,  0, -5,
          0,  0,  5,  5,  5,  5,  0, -5,
        -10,  5,  5,  5,  5,  5,  0,-10,
        -10,  0,  5,  0,  0,  0,  0,-10,
        -20,-10,-10, -5, -5,-10,-10,-20
      ],
      k: [
        -30,-40,-40,-50,-50,-40,-40,-30,
        -30,-40,-40,-50,-50,-40,-40,-30,
        -30,-40,-40,-50,-50,-40,-40,-30,
        -30,-40,-40,-50,-50,-40,-40,-30,
        -20,-30,-30,-40,-40,-30,-30,-20,
        -10,-20,-20,-20,-20,-20,-20,-10,
         20, 20,  0,  0,  0,  0, 20, 20,
         20, 30, 10,  0,  0, 10, 30, 20
      ]
    };

    function evaluateBoard(g) {
      let total = 0;
      const board = g.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = board[r][c];
          if (piece) {
            const val = pieceValues[piece.type] || 0;
            const idx = piece.color === 'w' ? (r * 8 + c) : ((7 - r) * 8 + c);
            const pTable = pst[piece.type] ? pst[piece.type][idx] : 0;
            if (piece.color === 'w') {
              total += (val + pTable);
            } else {
              total -= (val + pTable);
            }
          }
        }
      }
      return total;
    }

    function minimaxEval(g, depth, alpha, beta, isMaximizing) {
      if (depth <= 0 || g.game_over()) {
        if (g.in_checkmate()) {
          return isMaximizing ? -100000 : 100000;
        }
        if (g.in_draw()) return 0;
        return evaluateBoard(g);
      }

      const moves = g.moves({ verbose: true });
      if (!moves || moves.length === 0) return 0;

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (const m of moves) {
          g.move(m);
          const ev = minimaxEval(g, depth - 1, alpha, beta, false);
          g.undo();
          maxEval = Math.max(maxEval, ev);
          alpha = Math.max(alpha, ev);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const m of moves) {
          g.move(m);
          const ev = minimaxEval(g, depth - 1, alpha, beta, true);
          g.undo();
          minEval = Math.min(minEval, ev);
          beta = Math.min(beta, ev);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function getBuiltInBestMove(g, depth = 2, blunderChance = 0) {
      const moves = g.moves({ verbose: true });
      if (!moves || moves.length === 0) return null;
      
      if (blunderChance > 0 && Math.random() < blunderChance) {
        return moves[Math.floor(Math.random() * moves.length)];
      }

      const isWhite = g.turn() === 'w';
      let bestMove = moves[0];
      let bestVal = isWhite ? -Infinity : Infinity;

      // Shuffle moves to avoid predictable repetitiveness
      const shuffled = [...moves].sort(() => Math.random() - 0.5);

      for (const m of shuffled) {
        g.move(m);
        const val = minimaxEval(g, depth - 1, -Infinity, Infinity, !isWhite);
        g.undo();

        if (isWhite) {
          if (val > bestVal) {
            bestVal = val;
            bestMove = m;
          }
        } else {
          if (val < bestVal) {
            bestVal = val;
            bestMove = m;
          }
        }
      }
      return bestMove;
    }

    let engineReady = false;
    let engine = null;
    let hintsUsed = 0;
    
    try {
      engine = new Worker('npm/stockfish.js/stockfish.js');
      engine.onmessage = function(event) {
        const line = event.data;
        if (typeof line === 'string' && (line.includes('uciok') || line.startsWith('id name') || line.startsWith('Stockfish'))) {
          engineReady = true;
          console.log("♟️ Stockfish 2019 Multi-Variant Engine is READY and ACTIVE!");
        }
      };
      engine.postMessage('uci');
      engine.postMessage('ucinewgame');
    } catch (e) {
      console.warn("Stockfish worker unavailable, using built-in AI engine:", e);
    }

    let activeHint = null;
    let activeHintTimer = null;

    function clearActiveHint() {
      activeHint = null;
      clearTimeout(activeHintTimer);
      const banner = document.getElementById('hint-notification-banner');
      if (banner) {
        banner.style.opacity = '0';
        banner.style.transform = 'translate(-50%, -10px)';
        setTimeout(() => {
          if (!activeHint) banner.style.display = 'none';
        }, 300);
      }
    }

    function getPieceDisplayName(type) {
      const map = { p: 'Pawn', n: 'Knight', b: 'Bishop', r: 'Rook', q: 'Queen', k: 'King' };
      return map[type] || 'Piece';
    }

    function showHintNotification(hint) {
      const banner = document.getElementById('hint-notification-banner');
      const textEl = document.getElementById('hint-banner-text');
      if (!banner || !textEl || !hint) return;
      
      const pieceName = getPieceDisplayName(hint.piece);
      textEl.innerHTML = `Move <strong>${pieceName}</strong> from <span style="text-decoration: underline; font-size: 15px;">${hint.from.toUpperCase()}</span> to <span style="text-decoration: underline; font-size: 15px;">${hint.to.toUpperCase()}</span>`;
      
      banner.style.display = 'flex';
      banner.style.opacity = '0';
      banner.style.transform = 'translate(-50%, -10px)';
      
      void banner.offsetWidth; // force layout
      banner.style.opacity = '1';
      banner.style.transform = 'translate(-50%, 0)';
    }

    function requestHintMove() {
      const playerColor = currentPuzzle ? puzzlePlayerColor : 'w';
      if (game.turn() !== playerColor || game.game_over()) return;
      
      // 1. If playing puzzles, show puzzle solution move
      if (currentPuzzle && currentPuzzle.moves && currentPuzzle.moves[puzzleMoveIndex]) {
        const expectedMoveStr = currentPuzzle.moves[puzzleMoveIndex];
        const from = expectedMoveStr.substring(0, 2);
        const to = expectedMoveStr.substring(2, 4);
        const pObj = game.get(from);
        applyActiveHint({ from, to, piece: pObj ? pObj.type : 'p', san: from.toUpperCase() + ' → ' + to.toUpperCase() });
        return;
      }

      // 2. Query Stockfish if available
      if (engine && engineReady) {
        const history = game.history({ verbose: true });
        let moves = '';
        if (history.length > 0) {
          moves = ' moves ' + history.map(m => m.from + m.to + (m.promotion ? m.promotion : '')).join(' ');
        }

        let hintHandled = false;
        const onHintMsg = function(event) {
          const line = event.data;
          if (typeof line === 'string' && line.startsWith('bestmove')) {
            hintHandled = true;
            engine.removeEventListener('message', onHintMsg);
            const parts = line.split(' ');
            const moveStr = parts[1];
            if (moveStr && moveStr !== '(none)') {
              const from = moveStr.substring(0, 2);
              const to = moveStr.substring(2, 4);
              const pObj = game.get(from);
              applyActiveHint({ from, to, piece: pObj ? pObj.type : 'p', san: from.toUpperCase() + ' → ' + to.toUpperCase() });
            } else {
              const fallback = getBuiltInBestMove(game, 3, 0);
              if (fallback) applyActiveHint(fallback);
            }
          }
        };

        engine.addEventListener('message', onHintMsg);
        engine.postMessage('position startpos' + moves);
        engine.postMessage('go depth 8');

        // Fallback after 400ms
        setTimeout(() => {
          if (!hintHandled && game.turn() === playerColor) {
            engine.removeEventListener('message', onHintMsg);
            const fallback = getBuiltInBestMove(game, 3, 0);
            if (fallback) applyActiveHint(fallback);
          }
        }, 400);
      } else {
        // Built-in instant Minimax evaluator
        const best = getBuiltInBestMove(game, 3, 0);
        if (best) {
          applyActiveHint(best);
        }
      }
    }

    function applyActiveHint(best) {
      if (!best || !best.from || !best.to) return;
      const pObj = game.get(best.from);
      activeHint = {
        from: best.from,
        to: best.to,
        piece: best.piece || (pObj ? pObj.type : 'p'),
        san: best.san || (best.from.toUpperCase() + ' → ' + best.to.toUpperCase())
      };

      showHintNotification(activeHint);
      renderBoard('main-board');

      clearTimeout(activeHintTimer);
      activeHintTimer = setTimeout(() => {
        clearActiveHint();
        renderBoard('main-board');
      }, 15000);
    }

    function applyBotMoveObject(move) {
      if (!move || game.game_over() || game.turn() !== 'b') return;
      
      let isCapture = false;
      const targetPiece = game.get(move.to);
      if (targetPiece) isCapture = true;
      
      const executedMove = game.move({
        from: move.from,
        to: move.to,
        promotion: move.promotion || 'q'
      });
      
      if (executedMove) {
        playPieceMoveSound(executedMove.captured || isCapture, game.in_check());
        if (game.turn() === 'w') {
          handleCaptureStreak(executedMove.captured || isCapture);
        }
        lastMoveSqs = [move.from, move.to];
        if (executedMove.captured || isCapture) {
          const els = document.querySelectorAll('button, .audio-toggle, .player-hud');
          const b = document.getElementById('main-board');
          if (b) { b.classList.remove('board-shake'); void b.offsetWidth; b.classList.add('board-shake'); }
          els.forEach(el => {
            el.classList.remove('shake-delay-1', 'shake-delay-2');
            void el.offsetWidth;
            el.classList.add(Math.random() > 0.5 ? 'shake-delay-1' : 'shake-delay-2');
          });
        }
      }
      renderBoard('main-board');
      updateMoveHistory();
      checkGameOver();
    }

    let botMoveTimer = null;
    function makeBotMove() {
      if (game.turn() === 'w' || game.game_over()) return;
      clearTimeout(botMoveTimer);

      let depth = 2;
      let blunderChance = 0;

      if (currentGameMode === 'bot_easy') {
        depth = 1;
        blunderChance = 0.35;
      } else if (currentGameMode === 'bot_medium') {
        depth = 2;
        blunderChance = 0.05;
      } else if (currentGameMode === 'bot_hard') {
        depth = 3;
        blunderChance = 0;
      } else {
        if (currentOpponentRating < 1100) {
          depth = 1;
          blunderChance = 0.25;
        } else if (currentOpponentRating < 1600) {
          depth = 2;
          blunderChance = 0.05;
        } else {
          depth = 3;
          blunderChance = 0;
        }
      }

      let responded = false;

      if (engine && engineReady) {
        const startTime = Date.now();
        const minDelay = currentGameMode === 'bot_easy' ? 500 : (currentGameMode === 'bot_medium' ? 800 : 1100);

        let skillLevel = 20;
        let searchDepth = depth * 3;
        if (currentGameMode === 'bot_easy') { skillLevel = 3; searchDepth = 3; }
        else if (currentGameMode === 'bot_medium') { skillLevel = 10; searchDepth = 6; }
        else if (currentGameMode === 'bot_hard') { skillLevel = 20; searchDepth = 10; }
        else {
          skillLevel = Math.min(20, Math.max(1, Math.floor((currentOpponentRating - 700) / 75)));
          searchDepth = Math.min(12, Math.max(3, Math.floor((currentOpponentRating - 700) / 150) + 3));
        }

        try {
          engine.postMessage(`setoption name Skill Level value ${skillLevel}`);
        } catch(e) {}

        const history = game.history({ verbose: true });
        let moves = '';
        if (history.length > 0) {
          moves = ' moves ' + history.map(m => m.from + m.to + (m.promotion ? m.promotion : '')).join(' ');
        }

        const onStockfishMsg = function(event) {
          const line = event.data;
          if (typeof line === 'string' && line.startsWith('bestmove')) {
            responded = true;
            engine.removeEventListener('message', onStockfishMsg);
            const parts = line.split(' ');
            const moveStr = parts[1];

            const elapsed = Date.now() - startTime;
            const remainingDelay = Math.max(0, minDelay - elapsed);

            setTimeout(() => {
              if (moveStr && moveStr !== '(none)') {
                const source = moveStr.substring(0, 2);
                const target = moveStr.substring(2, 4);
                const promotion = moveStr.length > 4 ? moveStr.charAt(4) : 'q';
                applyBotMoveObject({ from: source, to: target, promotion: promotion });
              } else {
                const fallbackMove = getBuiltInBestMove(game, depth, blunderChance);
                applyBotMoveObject(fallbackMove);
              }
            }, remainingDelay);
          }
        };

        engine.addEventListener('message', onStockfishMsg);
        engine.postMessage('position startpos' + moves);
        engine.postMessage('go depth ' + searchDepth);

        // Generous 4000ms fail-safe timeout
        botMoveTimer = setTimeout(() => {
          if (!responded && game.turn() === 'b' && !game.game_over()) {
            engine.removeEventListener('message', onStockfishMsg);
            try { engine.postMessage('stop'); } catch(e) {}
            const fallbackMove = getBuiltInBestMove(game, depth, blunderChance);
            applyBotMoveObject(fallbackMove);
          }
        }, 4000);

      } else {
        // Natural thinking delay for built-in AI
        const minDelay = currentGameMode === 'bot_easy' ? 400 : (currentGameMode === 'bot_medium' ? 700 : 1000);
        botMoveTimer = setTimeout(() => {
          if (game.turn() === 'b' && !game.game_over()) {
            const fallbackMove = getBuiltInBestMove(game, depth, blunderChance);
            applyBotMoveObject(fallbackMove);
          }
        }, minDelay);
      }
    }

    function checkGameOver() {
      if (game.game_over()) {
        setTimeout(() => {
          if (game.in_checkmate()) {
            if (game.turn() === 'w') {
              concludeMatch('loss'); 
            } else {
              concludeMatch('win');
            }
          } else {
            alert('Game Over: Draw');
            returnToMenu();
          }
        }, 500);
      }
    }

    function updateMoveHistory() {
      const histContainer = document.querySelector('.move-list');
      if (!histContainer) return;
      
      const history = game.history();
      let html = '';
      for (let i = 0; i < history.length; i += 2) {
        const moveNum = Math.floor(i / 2) + 1;
        const wMove = history[i];
        const bMove = history[i+1] || '';
        html += `<div class="move-row"><span class="move-num">${moveNum}.</span><span class="move-white">${wMove}</span><span class="move-black">${bMove}</span></div>`;
      }
      histContainer.innerHTML = html;
      histContainer.scrollTop = histContainer.scrollHeight;
    }

    function renderBoard(elementId) {
      const container = document.getElementById(elementId);
      if (!container) return;
      container.innerHTML = '';
      
      const boardThemeObj = SKIN_DATA.boards.find(b => b.id === (userProfile.boardTheme || 'classic'));
      container.className = 'board-wrapper ' + (boardThemeObj ? boardThemeObj.cssClass : 'board-classic');

      const pieceMap = {
        'r': 'bR', 'n': 'bN', 'b': 'bB', 'q': 'bQ', 'k': 'bK', 'p': 'bP',
        'R': 'wR', 'N': 'wN', 'B': 'wB', 'Q': 'wQ', 'K': 'wK', 'P': 'wP'
      };

      const files = ['a','b','c','d','e','f','g','h'];
      const boardState = game.board();
      const playerColor = currentPuzzle ? puzzlePlayerColor : 'w';

      // Legal moves highlight enabled in ALL game modes
      let legalMoves = [];
      if (selectedPieceSq) {
        legalMoves = game.moves({ square: selectedPieceSq, verbose: true });
      }

      // Check if King is in check
      let checkedKingSq = null;
      if (game.in_check()) {
        const turnColor = game.turn();
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const piece = boardState[r][c];
            if (piece && piece.type === 'k' && piece.color === turnColor) {
              checkedKingSq = files[c] + (8 - r);
            }
          }
        }
      }

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement('div');
          const isLight = (r + c) % 2 === 0;
          sq.className = 'board-sq ' + (isLight ? 'light' : 'dark');
          sq.style.position = 'relative';
          
          const rank = 8 - r;
          const file = files[c];
          const sqName = file + rank;
          sq.id = 'sq-' + sqName;

          // Coordinate notation marks
          if (c === 0) {
            const rankLabel = document.createElement('span');
            rankLabel.className = 'board-coord-rank';
            rankLabel.innerText = rank;
            sq.appendChild(rankLabel);
          }
          if (r === 7) {
            const fileLabel = document.createElement('span');
            fileLabel.className = 'board-coord-file';
            fileLabel.innerText = file;
            sq.appendChild(fileLabel);
          }

          if (sqName === selectedPieceSq) {
            sq.classList.add('selected');
          }
          if (lastMoveSqs.includes(sqName)) {
            sq.classList.add('last-move');
          }
          if (sqName === checkedKingSq) {
            sq.classList.add('in-check');
          }
          if (activeHint && game.turn() === playerColor) {
            if (sqName === activeHint.from) {
              sq.classList.add('hint-from-sq');
              const badge = document.createElement('div');
              badge.className = 'hint-indicator-badge';
              badge.innerText = '💡';
              sq.appendChild(badge);
            } else if (sqName === activeHint.to) {
              sq.classList.add('hint-to-sq');
              const targetDot = document.createElement('div');
              targetDot.className = 'hint-target-marker';
              sq.appendChild(targetDot);
            }
          }

          const pObj = boardState[r][c];
          let sqImg = null;
          if (pObj) {
            const pChar = pObj.color === 'w' ? pObj.type.toUpperCase() : pObj.type;
            const currentPieceSetId = userProfile.pieceSet || 'classic';
            const pieceSkinObj = SKIN_DATA.pieces.find(p => p.id === currentPieceSetId) || SKIN_DATA.pieces[0];
            
            sqImg = document.createElement('img');
            sqImg.src = 'piece/cburnett/' + pieceMap[pChar] + '.svg';
            sqImg.className = 'piece';
            if (pieceSkinObj && pieceSkinObj.cssFilter !== 'none') {
              sqImg.style.filter = pieceSkinObj.cssFilter + ' drop-shadow(0 4px 4px rgba(0,0,0,0.4))';
            }
            
            if (sqName === lastMoveSqs[1]) {
               sqImg.classList.add('animate-drop');
            }
            
            if (pObj.color === playerColor && game.turn() === playerColor) {
              sqImg.draggable = false;
              sqImg.style.cursor = 'pointer';
            } else {
              sqImg.draggable = false;
            }
            
            sq.appendChild(sqImg);
          }
          
          const legalMove = legalMoves.find(m => m.to === sqName);
          if (legalMove) {
             const dot = document.createElement('div');
             dot.className = 'legal-dot' + (pObj ? ' capture' : '');
             sq.appendChild(dot);
          }

          sq.addEventListener('click', () => handleSquareClick(sqName, sqImg));

          container.appendChild(sq);
        }
      }
    }
  </script>
