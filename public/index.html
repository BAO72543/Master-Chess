<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Master Chess HTML5</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    /* CSS Reset and Font Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none; /* Prevent text selection in games */
    }

    body {
      background-color: #1a1a2e;
      font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* No scrolling allowed */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* The Game Container - scales to fit screen but maintains aspect ratio */
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: radial-gradient(circle at center, #2e2e4f 0%, #161625 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Screen Management */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }
    
    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .screen.zoom-out-fade {
      opacity: 0 !important;
      transform: scale(1.5) !important;
      transition: opacity 0.5s ease, transform 0.5s ease !important;
    }

    .btn-bullet-toggle {
      background: linear-gradient(to bottom, #7f8c8d 0%, #95a5a6 100%);
      box-shadow: 0 8px 0 #5f6a6b, 0 15px 20px rgba(0,0,0,0.4);
    }
    .btn-bullet-toggle.active {
      background: linear-gradient(to bottom, #ff4757 0%, #ff6b81 100%) !important;
      box-shadow: 0 8px 0 #cf2a2a, 0 15px 20px rgba(255, 71, 87, 0.4) !important;
      animation: pulseGlow 1.5s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 8px 0 #cf2a2a, 0 15px 20px rgba(255, 71, 87, 0.4); }
      100% { box-shadow: 0 8px 0 #cf2a2a, 0 15px 30px rgba(255, 71, 87, 0.8); }
    }

    .pulse {
      animation: pulseAnim 1s infinite alternate;
    }
    @keyframes pulseAnim {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    /* =========================================
       MAIN MENU SCREEN
       ========================================= */
    #menu-screen {
      padding: 20px;
    }

    /* Layout Containers */
    .screen-content {
      display: flex;
      width: 100%;
      max-width: 1200px;
      height: 100%;
      justify-content: center;
      align-items: center;
      gap: 40px;
    }

    .main-column {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 800px;
      height: 100%;
      justify-content: center;
      align-items: center;
    }

    #game-screen .main-column {
      justify-content: space-between;
    }

    /* Side Panels */
    .side-panel {
      display: none; /* Hidden by default on mobile */
      flex-direction: column;
      background: rgba(0, 0, 0, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      padding: 24px;
      width: 320px;
      height: min(80vh, 600px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      color: #fff;
      z-index: 10;
    }

    .side-panel h3 {
      margin: 0 0 16px 0;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ffd700;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    /* Leaderboard Styles */
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding-right: 12px; /* Prevent scrollbar sticking */
    }
    .lb-item {
      display: flex;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    .lb-score { color: #4facfe; }

    /* Move History Styles */
    .move-list {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      margin-bottom: 16px;
      padding-right: 12px; /* Prevent scrollbar sticking */
    }
    .move-row {
      display: flex;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-family: monospace;
      font-size: 16px;
    }
    .move-row:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    .move-num { width: 40px; color: #888; }
    .move-white { flex: 1; color: #fff; font-weight: bold; }
    .move-black { flex: 1; color: #aaa; font-weight: bold; }

    .match-controls {
      display: flex;
      gap: 10px;
    }
    .match-controls .btn-game { flex: 1; }

    /* Show side panels on wide screens */
    @media (min-width: 900px) {
      .side-panel {
        display: flex;
      }
    }

    /* Floating Chess Pieces Background Effect */
    .bg-pieces {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.1;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="%23ffffff"/></svg>');
      background-size: 150px;
      background-position: center;
      animation: floatBg 30s linear infinite;
    }

    @keyframes floatBg {
      0% { background-position: 0px 0px; }
      100% { background-position: 150px 150px; }
    }

    /* Game Logo */
    .game-logo {
      z-index: 10;
      text-align: center;
      margin-bottom: 60px;
      animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(0, 0, 0, 0.45);
      padding: 24px 48px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .game-logo h1 {
      font-size: 64px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 6px 0 #161625, 0 12px 20px rgba(0,0,0,0.8);
      margin: 0;
      line-height: 1;
    }
    .game-logo span {
      display: block;
      font-size: 28px;
      font-weight: 800;
      color: #ffd700;
      letter-spacing: 8px;
      text-shadow: 0 3px 0 #996515, 0 6px 15px rgba(0,0,0,0.6);
      margin-top: 5px;
    }

    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Chunky Game Buttons */
    .menu-buttons {
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 320px;
    }

    .btn-game {
      background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
      border: 4px solid #fff;
      border-radius: 20px;
      padding: 18px 24px;
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      cursor: pointer;
      box-shadow: 0 8px 0 #0088cc, 0 15px 20px rgba(0,0,0,0.4);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn-game:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.15);
    }

    .btn-game:active {
      transform: translateY(8px) scale(1) !important;
      box-shadow: 0 0px 0 #0088cc, 0 5px 10px rgba(0,0,0,0.4);
    }

    .btn-secondary {
      background: linear-gradient(to bottom, #f6d365 0%, #fda085 100%);
      box-shadow: 0 8px 0 #d97745, 0 15px 20px rgba(0,0,0,0.4);
    }
    .btn-secondary:active {
      box-shadow: 0 0px 0 #d97745, 0 5px 10px rgba(0,0,0,0.4);
    }
    
    .btn-tertiary {
      background: linear-gradient(to bottom, #43e97b 0%, #38f9d7 100%);
      box-shadow: 0 8px 0 #28b463, 0 15px 20px rgba(0,0,0,0.4);
    }
    .btn-tertiary:active {
      box-shadow: 0 0px 0 #28b463, 0 5px 10px rgba(0,0,0,0.4);
    }

    /* Audio Toggle */
    .audio-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: #4facfe;
      border: 3px solid #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      color: #fff;
      box-shadow: 0 5px 0 #0088cc, 0 10px 10px rgba(0,0,0,0.3);
      transition: all 0.1s ease;
    }
    .audio-toggle:active {
      transform: translateY(5px);
      box-shadow: 0 0px 0 #0088cc, 0 5px 10px rgba(0,0,0,0.3);
    }


    /* Pairing Screen */
    .pairing-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 60px 40px 40px 40px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .pairing-container h2 {
      color: #fff;
      margin-bottom: 30px;
      text-align: center;
    }
    .pairing-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top-color: #4facfe;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .pairing-match {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      text-align: center;
      gap: 30px;
    }
    .match-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      font-weight: bold;
      gap: 10px;
    }
    .match-player .player-avatar {
      width: 60px; height: 60px; font-size: 32px;
    }
    .match-vs {
      font-size: 24px; color: #ffd700; font-weight: 900; font-style: italic;
    }
    .match-rating {
      color: #ffd700; font-size: 14px;
    }

    /* =========================================
       IN-GAME SCREEN
       ========================================= */
    #game-screen {
      padding: 20px;
    }

    /* Top HUD */
    .hud-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .btn-pause {
      display: none; /* Hide pause button from main screen layout */
    }

    .btn-back {
      background: linear-gradient(to bottom, #747d8c 0%, #2f3542 100%) !important;
      box-shadow: 0 4px 0 #1e222b, 0 8px 10px rgba(0,0,0,0.3) !important;
      padding: 8px 14px !important;
      font-size: 14px !important;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 12px !important;
      border: 3px solid #fff !important;
      margin: 0;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }
    .btn-back:active {
      transform: translateY(4px) !important;
      box-shadow: 0 0px 0 #1e222b, 0 4px 5px rgba(0,0,0,0.3) !important;
    }

    .player-hud {
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.5);
      border-radius: 30px;
      padding: 6px 16px;
      border: 2px solid rgba(255,255,255,0.2);
      gap: 12px;
      height: 52px;
    }
    .player-avatar {
      width: 38px;
      height: 38px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .player-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .player-name {
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.2;
    }
    .player-score {
      color: #ffd700;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.2;
    }

    /* Board Area */
    .board-wrapper {
      width: min(90vw, 70vh);
      height: min(90vw, 70vh);
      aspect-ratio: 1/1;
      background: #739552;
      border: 8px solid #3c2a21;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      position: relative;
    }
    .board-sq {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .board-sq.light { background: #ebecd0; }
    .board-sq.dark { background: #739552; }
    .board-sq.selected { background: #f5f682 !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
    
    .board-sq img.piece {
      width: 90%;
      height: 90%;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s;
    }
    .board-sq img.piece.dragging {
      transform: scale(1.3) rotate(-5deg);
      filter: drop-shadow(0 15px 10px rgba(0,0,0,0.6));
      z-index: 1000;
      position: relative;
    }
    .board-sq.selected img.piece {
      transform: scale(1.3) rotate(-5deg);
      filter: drop-shadow(0 15px 10px rgba(0,0,0,0.6));
      z-index: 1000;
      position: relative;
    }
    
    @keyframes dropSnap {
      0% { transform: scale(1.3); }
      40% { transform: scale(0.85); }
      100% { transform: scale(1); }
    }
    img.piece.animate-drop {
      animation: dropSnap 0.2s ease-out;
    }

    .legal-dot {
      width: 25%;
      height: 25%;
      background: rgba(0,0,0,0.2);
      border-radius: 50%;
      position: absolute;
      pointer-events: none;
      z-index: 500;
    }
    .legal-dot.capture {
      width: 80%;
      height: 80%;
      background: transparent;
      border: 6px solid rgba(0,0,0,0.2);
    }

    /* Game Juice Animations */
    .board-sq.last-move {
      background: rgba(255, 255, 0, 0.4) !important;
      box-shadow: inset 0 0 15px rgba(255,215,0,0.5);
    }
    
    @keyframes screenShake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
    .board-shake { animation: screenShake 0.3s; }
    .shake-delay-1 { animation: screenShake 0.3s 0.05s; }
    .shake-delay-2 { animation: screenShake 0.3s 0.1s; }

    /* Bottom HUD */
    .hud-bottom {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
    }

    /* Pause Menu Overlay */
    #pause-menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #pause-menu.active {
      opacity: 1;
      pointer-events: auto;
    }
    .pause-box {
      background: #2e2e4f;
      border: 4px solid #fff;
      border-radius: 20px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #pause-menu.active .pause-box {
      transform: scale(1);
    }

  </style>
</head>
<body>

  <div id="game-container">
    
    <!-- AUDIO TOGGLE -->
    <div class="audio-toggle" id="btn-audio" onclick="toggleAudio()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
    </div>

    <!-- =========================================
         MAIN MENU SCREEN
         ========================================= -->
    <div id="menu-screen" class="screen active">
      <div class="bg-pieces"></div>
      
      <div class="screen-content">
        <div class="main-column">
          <div class="game-logo">
            <h1>Master</h1>
            <span>CHESS</span>
          </div>

          <div class="menu-buttons">
            <div style="display: flex; gap: 10px; width: 100%;">
              <button class="btn-game" style="flex:1; font-size:14px; padding: 10px;" onclick="startGame('bot_easy')">Easy Bot</button>
              <button class="btn-game" style="flex:1; font-size:14px; padding: 10px;" onclick="startGame('bot_medium')">Med Bot</button>
              <button class="btn-game" style="flex:1; font-size:14px; padding: 10px;" onclick="startGame('bot_hard')">Hard Bot</button>
            </div>
            <button id="btn-bullet-toggle" class="btn-game btn-bullet-toggle" onclick="toggleBulletMode()">
              Speed Mode: OFF
            </button>
            <button class="btn-game btn-secondary" onclick="startGame('online')">
              Multiplayer
            </button>
            <button class="btn-game btn-tertiary" onclick="startGame('puzzles')">
              Puzzles
            </button>
          </div>
        </div>

        <div class="side-panel leaderboard-panel">
          <h3>🏆 Top Players</h3>
          <div class="leaderboard-list" id="lb-list-container">
            <!-- Rendered via JS -->
          </div>
        </div>
      </div>
    </div>


    <!-- =========================================
         PAIRING SCREEN
         ========================================= -->
    <div id="pairing-screen" class="screen" style="justify-content: center;">
      <div class="bg-pieces"></div>
      <div class="pairing-container">
        <h2 id="pairing-status">Searching for Opponent...</h2>
        <div class="pairing-spinner" id="pairing-spinner"></div>
        <div class="pairing-match" id="pairing-match" style="display: none;">
          <div class="match-player">
            <div class="player-avatar">👤</div>
            <span id="match-user-name">You</span>
            <span class="match-rating" id="match-user-rating">1200</span>
          </div>
          <div class="match-vs">VS</div>
          <div class="match-player">
            <div class="player-avatar">🤖</div>
            <span id="match-opp-name">Opponent</span>
            <span class="match-rating" id="match-opp-rating">1200</span>
          </div>
        </div>
      </div>
    </div>


    <!-- =========================================
         IN-GAME SCREEN
         ========================================= -->
    <div id="game-screen" class="screen">
      <div class="screen-content">
        <div class="main-column">
          <!-- Top HUD (Opponent) -->
          <div class="hud-top" style="justify-content: flex-start; gap: 15px; width: 100%;">
            <button class="btn-back" onclick="returnToMenu()">◀ Return</button>
            <div class="player-hud" style="flex-grow: 1;">
              <div class="player-avatar">🤖</div>
              <div class="player-info">
                <span class="player-name" id="opp-name-top">Grandmaster Bot</span>
                <span class="player-score" id="opp-rating-top">Level 10</span>
              </div>
            </div>
            <div id="opp-timer" class="game-timer" style="display: none; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 12px; color: #ff4757; font-family: monospace; font-size: 24px; font-weight: 900; border: 2px solid #ff4757; text-shadow: 0 0 10px rgba(255,71,87,0.5); min-width: 80px; text-align: center;">01:00</div>
          </div>

          <!-- Chess Board -->
          <div class="board-wrapper" id="main-board">
            <!-- Rendered via JS -->
          </div>

          <!-- Bottom HUD (Player) -->
          <div class="hud-bottom" style="width: 100%; display: flex; justify-content: flex-end; gap: 15px;">
            <div id="user-timer" class="game-timer" style="display: none; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 12px; color: #38f9d7; font-family: monospace; font-size: 24px; font-weight: 900; border: 2px solid #38f9d7; text-shadow: 0 0 10px rgba(56,249,215,0.5); min-width: 80px; text-align: center;">01:00</div>
            <div class="player-hud" style="flex-grow: 1; max-width: max-content;">
              <div class="player-info" style="text-align: right;">
                <span class="player-name" id="user-name-bottom">You</span>
                <span class="player-score" id="user-rating-bottom">Beginner</span>
              </div>
              <div class="player-avatar">👤</div>
            </div>
          </div>
        </div>

        <div class="side-panel move-history-panel">
          <h3>Move History</h3>
          <div class="move-list">
            <!-- Rendered via JS -->
          </div>
          <div class="match-controls">
            <button class="btn-game btn-tertiary" style="font-size: 14px; padding: 10px;" onclick="endFakeGame('win')">🏆 Win (Test)</button>
            <button class="btn-game btn-secondary" style="font-size: 14px; padding: 10px;" onclick="endFakeGame('loss')">🏳 Resign</button>
          </div>
        </div>
      </div>
    </div>

    <!-- PAUSE MENU OVERLAY -->
    <div id="pause-menu">
      <div class="pause-box">
        <h2 style="color: #fff; text-align: center; margin-bottom: 10px; font-size: 32px;">PAUSED</h2>
        <button class="btn-game" style="font-size: 20px; padding: 12px 20px;" onclick="togglePause()">Resume</button>
        <button class="btn-game btn-secondary" style="font-size: 20px; padding: 12px 20px;" onclick="returnToMenu()">Quit Game</button>
      </div>
    </div>

    <!-- ENDGAME MODAL -->
    <div id="endgame-modal" style="display: none; position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:200; flex-direction:column; align-items:center; justify-content:center;">
      <div style="background: #191930; border: 4px solid rgba(255,255,255,0.8); border-radius: 20px; padding: 40px; text-align: center; width: 80%; max-width: 400px; box-shadow: 0 0 50px rgba(0,0,0,0.9);">
        <h2 id="endgame-title" style="color: #ffd700; font-size: 40px; margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 4px 10px rgba(0,0,0,0.5);">VICTORY</h2>
        <div style="margin-bottom: 30px;">
          <div style="color: #e2e8f0; font-size: 18px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 2px 6px rgba(0,0,0,0.6); margin-bottom: 10px;">Rating</div>
          <div id="endgame-elo" style="color: #4facfe; font-size: 48px; font-weight: 900; font-family: monospace; text-shadow: 0 4px 10px rgba(0,0,0,0.6);">1200</div>
          <div id="endgame-diff" style="color: #38f9d7; font-size: 20px; font-weight: bold; margin-top: 5px; text-shadow: 0 2px 6px rgba(0,0,0,0.5);">+25</div>
        </div>
        <button id="btn-rematch" class="btn-game btn-tertiary pulse" style="font-size: 20px; padding: 12px 30px; width: 100%; margin-bottom: 20px; display: none;" onclick="rematchGame()">Play Again</button>
        <button class="btn-game" style="font-size: 20px; padding: 12px 30px; width: 100%;" onclick="closeEndgameModal()">Main Menu</button>
      </div>
    </div>

  </div>

  <script>
    // Audio Manager
    const audioMove = new Audio('/sound/standard/Move.mp3');
    const audioCapture = new Audio('/sound/standard/Capture.mp3');
    
    // Ticking audio generator
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTick() {
      if (!audioOn) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(800 + Math.random()*200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function playBuzzer() {
      if (!audioOn) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    // Synthesized Crisp Button Click Sound
    function playClickSound() {
      if (!audioOn) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    // Bind click sound to all buttons and selectors globally
    document.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.classList.contains('audio-toggle')) {
        playClickSound();
      }
    });

    // Unblock & trigger TTS on first click
    document.addEventListener('click', () => {
      if (window.speechSynthesis && window.speechSynthesis.speak) {
        const u = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(u);
      }
    }, { once: true });

    let lastHeartbeatTime = 0;
    function playHeartbeat() {
      if (!audioOn) return;
      const now = Date.now();
      if (now - lastHeartbeatTime < 1000) return;
      lastHeartbeatTime = now;
      
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(65, audioCtx.currentTime);
      gain1.gain.setValueAtTime(0.9, audioCtx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start();
      osc1.stop(audioCtx.currentTime + 0.18);
      
      setTimeout(() => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(55, audioCtx.currentTime);
        gain2.gain.setValueAtTime(0.7, audioCtx.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start();
        osc2.stop(audioCtx.currentTime + 0.18);
      }, 150);
    }

    // Streak Manager
    let currentStreak = 0;
    function handleCaptureStreak(isCapture) {
      if (!audioOn) return;
      if (isCapture) {
        currentStreak++;
        let msg = null;
        if (currentStreak === 1) msg = "Capture!";
        else if (currentStreak === 2) msg = "Double Strike!";
        else if (currentStreak >= 3) msg = "Dominating!";
        
        if (msg && window.speechSynthesis) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(msg);
          utterance.rate = 1.0;
          utterance.volume = 1.0;
          if (window.speechSynthesis.getVoices) {
            const voices = window.speechSynthesis.getVoices();
            const maleVoice = voices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('uk english male') || v.name.toLowerCase().includes('david'));
            if (maleVoice) utterance.voice = maleVoice;
          }
          window.speechSynthesis.speak(utterance);
        }
      } else {
        currentStreak = 0;
      }
    }

    // Speed / Bullet Mode Variables
    let bulletModeActive = false;
    let userTimeLeft = 60;
    let oppTimeLeft = 60;
    let clockInterval = null;
    let lastActiveGameMode = '';

    function toggleBulletMode() {
      bulletModeActive = !bulletModeActive;
      const btn = document.getElementById('btn-bullet-toggle');
      if (bulletModeActive) {
        btn.classList.add('active');
        btn.innerText = 'Speed Mode: ON';
      } else {
        btn.classList.remove('active');
        btn.innerText = 'Speed Mode: OFF';
      }
      playTick();
    }

    // User Identity & Leaderboard Logic
    let userProfile = { name: 'Anonymous', rating: 1200 };
    
    function initUser() {
      const stored = localStorage.getItem('chess_user');
      if (stored) {
        userProfile = JSON.parse(stored);
      } else {
        userProfile.name = 'Anonymous ' + Math.floor(1000 + Math.random() * 9000);
        userProfile.rating = 1200;
        localStorage.setItem('chess_user', JSON.stringify(userProfile));
      }
      document.getElementById('user-name-bottom').innerText = userProfile.name;
      document.getElementById('user-rating-bottom').innerText = userProfile.rating;
      renderLeaderboard();
    }

    function generateFakePlayers() {
      const gms = [
        {name: "GM Magnus", score: 3215},
        {name: "GM Hikaru", score: 3200},
        {name: "GM DingLiren", score: 3110},
        {name: "GM Fabiano", score: 3095},
        {name: "GM Gukesh", score: 3080},
        {name: "IM LevyRozman", score: 2890},
        {name: "ChessBot9000", score: 2750},
        {name: "RookieKing", score: 1850}
      ];
      
      const list = [...gms];
      for (let i = 1; i <= 992; i++) {
        let score = Math.floor(800 + Math.random() * 1400); // 800 to 2200 ELO
        list.push({
          name: 'Anonymous ' + Math.floor(1000 + Math.random() * 9000),
          score: score
        });
      }
      return list;
    }

    function getLeaderboard() {
      let stored = localStorage.getItem('chess_leaderboard');
      if (stored) {
        return JSON.parse(stored);
      }
      let players = generateFakePlayers();
      localStorage.setItem('chess_leaderboard', JSON.stringify(players));
      return players;
    }

    function renderLeaderboard() {
      const lbContainer = document.getElementById('lb-list-container');
      const allPlayers = getLeaderboard();
      
      let list = allPlayers.filter(p => p.name !== userProfile.name);
      list.push({ name: userProfile.name, score: userProfile.rating, isUser: true });
      
      list.sort((a,b) => b.score - a.score);
      
      const userRank = list.findIndex(p => p.isUser) + 1;
      
      let html = '';
      const displayCount = Math.min(10, list.length);
      for (let i = 0; i < displayCount; i++) {
        const p = list[i];
        const bg = p.isUser ? 'background: rgba(79, 172, 254, 0.2); border: 1px solid #4facfe;' : '';
        html += `<div class="lb-item" style="${bg}"><span>${i+1}. ${p.name}</span><span class="lb-score">${p.score}</span></div>`;
      }
      
      if (userRank > 10) {
        html += `<div style="text-align: center; color: rgba(255,255,255,0.4); font-weight: bold; margin: 4px 0;">...</div>`;
        html += `<div class="lb-item" style="background: rgba(79, 172, 254, 0.2); border: 1px solid #4facfe;"><span>${userRank}. ${userProfile.name}</span><span class="lb-score">${userProfile.rating}</span></div>`;
      }
      
      lbContainer.innerHTML = html;
    }

    // Screen Management
    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function initClocks() {
      clearInterval(clockInterval);
      document.getElementById('opp-timer').style.display = bulletModeActive ? 'block' : 'none';
      document.getElementById('user-timer').style.display = bulletModeActive ? 'block' : 'none';
      
      if (!bulletModeActive) return;
      
      userTimeLeft = 60;
      oppTimeLeft = 60;
      updateClockDisplay();
      startClocks();
    }

    function startClocks() {
      clearInterval(clockInterval);
      clockInterval = setInterval(() => {
        if (game.game_over()) {
          clearInterval(clockInterval);
          return;
        }
        if (game.turn() === 'w') {
          userTimeLeft--;
          if (userTimeLeft <= 10 && userTimeLeft > 0) {
            playHeartbeat();
          }
          if (userTimeLeft <= 0) {
            clearInterval(clockInterval);
            endFakeGame('loss');
          }
        } else {
          oppTimeLeft--;
          if (oppTimeLeft <= 0) {
            clearInterval(clockInterval);
            endFakeGame('win');
          }
        }
        updateClockDisplay();
      }, 1000);
    }

    function updateClockDisplay() {
      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };
      document.getElementById('user-timer').innerText = formatTime(userTimeLeft);
      document.getElementById('opp-timer').innerText = formatTime(oppTimeLeft);
      
      document.getElementById('user-timer').style.borderColor = userTimeLeft <= 10 ? '#ff4757' : '#38f9d7';
      document.getElementById('user-timer').style.color = userTimeLeft <= 10 ? '#ff4757' : '#38f9d7';
      if (userTimeLeft <= 10) {
         document.getElementById('user-timer').style.textShadow = '0 0 10px rgba(255,71,87,0.8)';
      } else {
         document.getElementById('user-timer').style.textShadow = '0 0 10px rgba(56,249,215,0.5)';
      }
    }

    let game = new Chess();
    let currentOpponentRating = 1200;
    let currentGameMode = '';

    function configureEngine(targetElo) {
      engine.postMessage('setoption name UCI_LimitStrength value true');
      engine.postMessage('setoption name UCI_Elo value ' + Math.min(2850, Math.max(1350, targetElo)));
    }

    function startGame(mode) {
      game.reset();
      lastMoveSqs = [];
      selectedPieceSq = null;
      lastActiveGameMode = mode;
      updateMoveHistory();
      currentGameMode = mode;
      
      if (mode === 'online') {
        startFakeMultiplayer();
      } else if (mode.startsWith('bot_')) {
        let oppName = 'Bot';
        let diff = 0;
        
        if (mode === 'bot_easy') {
          oppName = 'Beginner Bot';
          diff = -200;
        } else if (mode === 'bot_medium') {
          oppName = 'Club Bot';
          diff = 0;
        } else if (mode === 'bot_hard') {
          oppName = 'Master Bot';
          diff = +400;
        }
        
        currentOpponentRating = Math.max(800, userProfile.rating + diff);
        document.getElementById('opp-name-top').innerText = oppName;
        document.getElementById('opp-rating-top').innerText = currentOpponentRating;
        
        configureEngine(currentOpponentRating);
        
        switchScreen('game-screen');
        setTimeout(() => renderBoard('main-board'), 100);
        initClocks();
      }
    }

    function startFakeMultiplayer() {
      document.getElementById('pairing-screen').classList.remove('zoom-out-fade');
      switchScreen('pairing-screen');
      
      document.getElementById('pairing-status').innerText = 'Searching for Opponent...';
      document.getElementById('pairing-spinner').style.display = 'block';
      document.getElementById('pairing-match').style.display = 'none';

      // 1.0 seconds search
      setTimeout(() => {
        const oppName = 'Anonymous ' + Math.floor(1000 + Math.random() * 9000);
        const oppRating = userProfile.rating + Math.floor(Math.random() * 100) - 50;
        currentOpponentRating = oppRating;
        
        configureEngine(currentOpponentRating);
        
        document.getElementById('pairing-status').innerText = 'Match Found!';
        document.getElementById('pairing-spinner').style.display = 'none';
        document.getElementById('pairing-match').style.display = 'flex';
        
        document.getElementById('match-user-name').innerText = userProfile.name;
        document.getElementById('match-user-rating').innerText = userProfile.rating;
        document.getElementById('match-opp-name').innerText = oppName;
        document.getElementById('match-opp-rating').innerText = oppRating;
        
        document.getElementById('opp-name-top').innerText = oppName;
        document.getElementById('opp-rating-top').innerText = oppRating;

        playBuzzer();

        // 0.5s match found display -> zoom transition
        setTimeout(() => {
          const ps = document.getElementById('pairing-screen');
          ps.classList.add('zoom-out-fade');
          setTimeout(() => {
            switchScreen('game-screen');
            ps.classList.remove('zoom-out-fade');
            setTimeout(() => renderBoard('main-board'), 100);
            initClocks();
          }, 400);
        }, 500);

      }, 1000);
    }

    function endFakeGame(result) {
      const diff = currentOpponentRating - userProfile.rating;
      let winReward = 25;
      let lossPenalty = 20;
      
      if (currentGameMode === 'bot_easy') {
        winReward = 10;
        lossPenalty = 25;
      } else if (currentGameMode === 'bot_medium') {
        winReward = 25;
        lossPenalty = 20;
      } else if (currentGameMode === 'bot_hard') {
        winReward = 40;
        lossPenalty = 10;
      } else if (currentGameMode === 'online') {
        winReward = Math.max(10, 25 + Math.floor(diff / 20));
        lossPenalty = Math.max(10, 20 - Math.floor(diff / 20));
      }

      if (bulletModeActive) {
        winReward = Math.floor(winReward * 1.5);
      }

      clearInterval(clockInterval);
      const oldRating = userProfile.rating;
      let newRating = oldRating;
      let diffStr = '';
      
      if (result === 'win') {
        newRating = oldRating + winReward;
        diffStr = '+' + winReward;
      } else if (result === 'loss') {
        newRating = Math.max(0, oldRating - lossPenalty); // Prevent negative
        diffStr = '-' + lossPenalty;
      }
      
      userProfile.rating = newRating;
      
      // Save and re-render
      localStorage.setItem('chess_user', JSON.stringify(userProfile));
      document.getElementById('user-rating-bottom').innerText = userProfile.rating;
      renderLeaderboard();
      
      showEndgameModal(result, oldRating, newRating, diffStr);
    }

    function showEndgameModal(result, oldRating, newRating, diffStr) {
      const modal = document.getElementById('endgame-modal');
      const title = document.getElementById('endgame-title');
      const elo = document.getElementById('endgame-elo');
      const diffLabel = document.getElementById('endgame-diff');
      const rematchBtn = document.getElementById('btn-rematch');
      
      title.innerText = result === 'win' ? 'VICTORY' : 'DEFEAT';
      title.style.color = result === 'win' ? '#ffd700' : '#ff4757';
      diffLabel.innerText = diffStr;
      diffLabel.style.color = result === 'win' ? '#38f9d7' : '#ff4757';
      
      if (currentGameMode !== 'puzzles') {
        rematchBtn.style.display = 'block';
      } else {
        rematchBtn.style.display = 'none';
      }
      
      modal.style.display = 'flex';
      
      if (result === 'win' && typeof confetti !== 'undefined') {
        confetti({
          particleCount: 150,
          spread: 80,
          origin: { y: 0.6 },
          colors: ['#ffd700', '#ff4757', '#00f2fe', '#38f9d7']
        });
      }
      
      // Animate ELO
      let currentDisplayRating = oldRating;
      const ticks = 30; // Number of animation frames
      const ratingStep = (newRating - oldRating) / ticks;
      let frame = 0;
      
      function tickAnimation() {
        if (frame < ticks) {
          currentDisplayRating += ratingStep;
          elo.innerText = Math.round(currentDisplayRating);
          playTick();
          frame++;
          requestAnimationFrame(tickAnimation);
        } else {
          elo.innerText = newRating;
        }
      }
      
      setTimeout(() => requestAnimationFrame(tickAnimation), 500); // short delay
    }

    function closeEndgameModal() {
      document.getElementById('endgame-modal').style.display = 'none';
      returnToMenu();
    }

    function rematchGame() {
      document.getElementById('endgame-modal').style.display = 'none';
      startGame(lastActiveGameMode);
    }

    // Initialize on load
    window.onload = initUser;

    function returnToMenu() {
      clearInterval(clockInterval);
      document.getElementById('pause-menu').classList.remove('active');
      switchScreen('menu-screen');
    }

    // Pause Menu
    function togglePause() {
      const pm = document.getElementById('pause-menu');
      if (pm.classList.contains('active')) {
        pm.classList.remove('active');
        if (bulletModeActive) {
          startClocks();
        }
      } else {
        pm.classList.add('active');
        clearInterval(clockInterval);
      }
    }

    // Audio Toggle Mock
    const svgAudioOn = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>';
    const svgAudioOff = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';
    let audioOn = true;
    function toggleAudio() {
      audioOn = !audioOn;
      document.getElementById('btn-audio').innerHTML = audioOn ? svgAudioOn : svgAudioOff;
    }

    let selectedPieceSq = null;
    let lastMoveSqs = [];

    function handleSquareClick(sq, imgEl) {
      if (selectedPieceSq) {
        const success = attemptMove(selectedPieceSq, sq);
        if (!success && game.get(sq) && game.get(sq).color === 'w') {
          selectedPieceSq = sq;
          renderBoard('main-board');
        } else {
          selectedPieceSq = null;
          renderBoard('main-board');
        }
      } else {
        const piece = game.get(sq);
        if (piece && piece.color === 'w') {
          selectedPieceSq = sq;
          renderBoard('main-board');
        }
      }
    }

    function attemptMove(fromSq, toSq) {
      let isCapture = false;
      const targetPiece = game.get(toSq);
      if (targetPiece && targetPiece.color !== game.get(fromSq).color) {
        isCapture = true;
      }
      
      const move = game.move({
        from: fromSq,
        to: toSq,
        promotion: 'q'
      });

      if (move) {
        if (audioOn) {
          if (move.captured || isCapture) {
             audioCapture.currentTime = 0;
             audioCapture.play().catch(e=>console.log(e));
          } else {
             audioMove.currentTime = 0;
             audioMove.play().catch(e=>console.log(e));
          }
        }
        if (game.turn() === 'b') { // User just moved (white)
           handleCaptureStreak(move.captured || isCapture);
        }
        if (move.captured || isCapture) {
          const els = document.querySelectorAll('button, .audio-toggle, .player-hud');
          const b = document.getElementById('main-board');
          if(b) { b.classList.remove('board-shake'); void b.offsetWidth; b.classList.add('board-shake'); }
          els.forEach(el => {
             el.classList.remove('shake-delay-1', 'shake-delay-2');
             void el.offsetWidth;
             el.classList.add(Math.random() > 0.5 ? 'shake-delay-1' : 'shake-delay-2');
          });
        }
        
        renderBoard('main-board');
        updateMoveHistory();
        checkGameOver();
        
        if (!game.game_over()) {
          setTimeout(makeBotMove, 400);
        }
        return true;
      }
      return false;
    }

    let engineReady = false;
    let engine = new Worker('/npm/stockfish.js/stockfish.js');
    
    engine.onmessage = function(event) {
      const line = event.data;
      if (line === 'uciok') {
        engineReady = true;
      } else if (line.startsWith('bestmove')) {
        const parts = line.split(' ');
        const moveStr = parts[1];
        
        if (moveStr && moveStr !== '(none)') {
          const source = moveStr.substring(0, 2);
          const target = moveStr.substring(2, 4);
          const promotion = moveStr.length > 4 ? moveStr.charAt(4) : 'q';
          
          let isCapture = false;
          const targetPiece = game.get(target);
          if (targetPiece) isCapture = true;
          
          const move = game.move({
            from: source,
            to: target,
            promotion: promotion
          });
          
          if (move) {
             if (audioOn) {
                if (move.captured || isCapture) {
                   audioCapture.currentTime = 0;
                   audioCapture.play().catch(e=>console.log(e));
                } else {
                   audioMove.currentTime = 0;
                   audioMove.play().catch(e=>console.log(e));
                }
             }
             if (game.turn() === 'w') { // Bot just moved (black)
                handleCaptureStreak(move.captured || isCapture);
             }
             lastMoveSqs = [source, target];
             if (move.captured || isCapture) {
                const els = document.querySelectorAll('button, .audio-toggle, .player-hud');
                const b = document.getElementById('main-board');
                if(b) { b.classList.remove('board-shake'); void b.offsetWidth; b.classList.add('board-shake'); }
                els.forEach(el => {
                   el.classList.remove('shake-delay-1', 'shake-delay-2');
                   void el.offsetWidth;
                   el.classList.add(Math.random() > 0.5 ? 'shake-delay-1' : 'shake-delay-2');
                });
             }
          }
          
          renderBoard('main-board');
          updateMoveHistory();
          checkGameOver();
        }
      }
    };
    
    engine.postMessage('uci');
    engine.postMessage('ucinewgame');

    function makeBotMove() {
      if (!engineReady) {
        setTimeout(makeBotMove, 500);
        return;
      }
      
      const history = game.history({ verbose: true });
      let moves = '';
      if (history.length > 0) {
        moves = ' moves ' + history.map(m => m.from + m.to + (m.promotion ? m.promotion : '')).join(' ');
      }
      
      engine.postMessage('position startpos' + moves);
      engine.postMessage('go depth 10');
    }

    function checkGameOver() {
      if (game.game_over()) {
        setTimeout(() => {
          if (game.in_checkmate()) {
            if (game.turn() === 'w') {
              endFakeGame('loss'); 
            } else {
              endFakeGame('win');
            }
          } else {
            alert('Game Over: Draw');
            returnToMenu();
          }
        }, 500);
      }
    }

    function updateMoveHistory() {
      const histContainer = document.querySelector('.move-list');
      if (!histContainer) return;
      
      const history = game.history();
      let html = '';
      for (let i = 0; i < history.length; i += 2) {
        const moveNum = Math.floor(i / 2) + 1;
        const wMove = history[i];
        const bMove = history[i+1] || '';
        html += `<div class="move-row"><span class="move-num">${moveNum}.</span><span class="move-white">${wMove}</span><span class="move-black">${bMove}</span></div>`;
      }
      histContainer.innerHTML = html;
      histContainer.scrollTop = histContainer.scrollHeight;
    }

    function renderBoard(elementId) {
      const container = document.getElementById(elementId);
      if (!container) return;
      container.innerHTML = '';

      const pieceMap = {
        'r': 'bR', 'n': 'bN', 'b': 'bB', 'q': 'bQ', 'k': 'bK', 'p': 'bP',
        'R': 'wR', 'N': 'wN', 'B': 'wB', 'Q': 'wQ', 'K': 'wK', 'P': 'wP'
      };

      const files = ['a','b','c','d','e','f','g','h'];
      const boardState = game.board();

      let legalMoves = [];
      if (currentGameMode === 'bot_easy' && selectedPieceSq) {
        legalMoves = game.moves({ square: selectedPieceSq, verbose: true });
      }

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement('div');
          const isLight = (r + c) % 2 === 0;
          sq.className = 'board-sq ' + (isLight ? 'light' : 'dark');
          sq.style.position = 'relative';
          
          const rank = 8 - r;
          const file = files[c];
          const sqName = file + rank;

          if (sqName === selectedPieceSq) {
            sq.classList.add('selected');
          }
          if (lastMoveSqs.includes(sqName)) {
            sq.classList.add('last-move');
          }

          let img = null;
          const pObj = boardState[r][c];
          if (pObj) {
            const pChar = pObj.color === 'w' ? pObj.type.toUpperCase() : pObj.type;
            img = document.createElement('img');
            img.className = 'piece';
            img.src = '/piece/cburnett/' + pieceMap[pChar] + '.svg';
            img.alt = pChar;
            
            if (sqName === lastMoveSqs[1]) {
               img.classList.add('animate-drop');
            }
            
            if (pObj.color === 'w') {
              img.draggable = false;
              img.style.cursor = 'pointer';
            } else {
              img.draggable = false;
            }
            
            sq.appendChild(img);
          }
          
          const legalMove = legalMoves.find(m => m.to === sqName);
          if (legalMove) {
             const dot = document.createElement('div');
             dot.className = 'legal-dot' + (pObj ? ' capture' : '');
             sq.appendChild(dot);
          }

          sq.addEventListener('click', () => handleSquareClick(sqName, img));

          container.appendChild(sq);
        }
      }
    }
  </script>
</body>
</html>
