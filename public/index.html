<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Master Chess HTML5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="vendor/chess.min.js"></script>
  <script>
    if (typeof Chess === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"><\/script>');
    }
  </script>
  <script src="vendor/confetti.browser.min.js"></script>
  <script>
    if (typeof confetti === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"><\/script>');
    }
  </script>
  
  <style>
    /* CSS Reset and Font Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none; /* Prevent text selection in games */
    }

    html {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background-color: #161625;
      background: radial-gradient(circle at center, #2e2e4f 0%, #161625 100%) no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background-color: #161625;
      background: radial-gradient(circle at center, #2e2e4f 0%, #161625 100%) no-repeat center center fixed;
      background-size: cover;
      font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* The Game Container - scales to fit any screen & covers 100% aspect ratio */
    #game-container {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at center, #2e2e4f 0%, #161625 100%) no-repeat center center fixed;
      background-size: cover;
      background-position: center;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Screen Management */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
      background: transparent;
      overflow: hidden;
    }
    
    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .screen.zoom-out-fade {
      opacity: 0 !important;
      transform: scale(1.5) !important;
      transition: opacity 0.5s ease, transform 0.5s ease !important;
    }

    .btn-bullet-toggle {
      background: linear-gradient(to bottom, #7f8c8d 0%, #95a5a6 100%);
      box-shadow: 0 8px 0 #5f6a6b, 0 15px 20px rgba(0,0,0,0.4);
    }
    .btn-bullet-toggle.active {
      background: linear-gradient(to bottom, #ff4757 0%, #ff6b81 100%) !important;
      box-shadow: 0 8px 0 #cf2a2a, 0 15px 20px rgba(255, 71, 87, 0.4) !important;
      animation: pulseGlow 1.5s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 8px 0 #cf2a2a, 0 15px 20px rgba(255, 71, 87, 0.4); }
      100% { box-shadow: 0 8px 0 #cf2a2a, 0 15px 30px rgba(255, 71, 87, 0.8); }
    }

    .pulse {
      animation: pulseAnim 1s infinite alternate;
    }
    @keyframes pulseAnim {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    /* Main Menu Screen */
    #menu-screen {
      padding: 20px;
    }

    /* Layout Containers */
    .screen-content {
      display: flex;
      width: 100%;
      max-width: 1200px;
      height: 100%;
      justify-content: center;
      align-items: center;
      gap: 40px;
    }

    .main-column {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 800px;
      height: 100%;
      justify-content: center;
      align-items: center;
    }

    #game-screen .main-column {
      justify-content: space-between;
    }

    /* Side Panels - only displayed on wide landscape layouts */
    .side-panel {
      display: none;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      padding: 24px;
      width: 320px;
      height: min(80vh, 600px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      color: #fff;
      z-index: 10;
    }

    .side-panel h3 {
      margin: 0 0 16px 0;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ffd700;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    /* Leaderboard Styles */
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding-right: 12px; /* Prevent scrollbar sticking */
    }
    .lb-item {
      display: flex;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    .lb-score { color: #4facfe; }

    /* Move History Styles */
    .move-list {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      margin-bottom: 16px;
      padding-right: 12px; /* Prevent scrollbar sticking */
    }
    .move-row {
      display: flex;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-family: monospace;
      font-size: 16px;
    }
    .move-row:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    .move-num { width: 40px; color: #888; }
    .move-white { flex: 1; color: #fff; font-weight: bold; }
    .move-black { flex: 1; color: #aaa; font-weight: bold; }

    .match-controls {
      display: flex;
      gap: 10px;
    }
    .match-controls .btn-game { flex: 1; }

    /* Show side panels only on wide landscape displays */
    @media (min-width: 960px) and (min-aspect-ratio: 1.25) {
      .side-panel {
        display: flex;
      }
    }

    /* Customization Screen Layout */
    #customization-screen {
      justify-content: flex-start !important;
      align-items: center !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      -webkit-overflow-scrolling: touch;
      padding: 20px 16px 80px !important;
      box-sizing: border-box;
      height: 100% !important;
      width: 100% !important;
    }

    .customization-header-bar {
      width: 100%;
      max-width: 1100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      margin-bottom: 6px;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    .btn-custom-back {
      padding: 10px 20px !important;
      font-size: 16px !important;
      font-weight: 800 !important;
      border-radius: 14px !important;
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
      cursor: pointer !important;
      box-shadow: 0 4px 0 #d97745, 0 8px 12px rgba(0,0,0,0.3) !important;
      border: 3px solid #fff !important;
      min-width: 100px !important;
      margin: 0 !important;
      flex-shrink: 0;
    }

    .custom-title {
      color: #fff;
      margin: 0;
      font-size: 32px;
      font-weight: 900;
      text-align: center;
      text-shadow: 0 3px 10px rgba(0,0,0,0.6);
      flex: 1;
    }

    .custom-header-spacer {
      width: 100px;
      flex-shrink: 0;
    }

    .custom-wins-badge {
      color: #ffd700;
      text-align: center;
      margin-bottom: 20px;
      margin-top: 4px;
      font-weight: 900;
      font-size: 20px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      background: rgba(0,0,0,0.4);
      padding: 6px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255,215,0,0.3);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }

    .customization-content {
      width: 100%;
      max-width: 1100px;
      padding: 0 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 40px;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    @media (min-width: 900px) and (min-aspect-ratio: 1.25) {
      .customization-content {
        grid-template-columns: 1fr 1fr;
        gap: 25px;
        align-items: stretch;
      }
    }

    @media (max-width: 600px) {
      .customization-header-bar {
        padding: 6px 4px;
      }
      .btn-custom-back {
        padding: 8px 14px !important;
        font-size: 14px !important;
        min-width: 75px !important;
      }
      .custom-title {
        font-size: 22px;
      }
      .custom-header-spacer {
        width: 75px;
      }
      .custom-wins-badge {
        font-size: 16px;
        padding: 4px 14px;
        margin-bottom: 15px;
      }
    }

    .skin-section-panel {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      height: 100%;
      box-sizing: border-box;
    }

    .skin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      flex: 1;
      align-content: start;
    }

    .skin-card {
      backdrop-filter: blur(10px);
      padding: 10px 8px;
      border-radius: 12px;
      text-align: center;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 155px;
      box-sizing: border-box;
    }

    .skin-preview-placeholder {
      height: 56px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .skin-title-placeholder {
      height: 20px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .skin-badge-container {
      height: 48px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Floating Chess Pieces Background Effect */
    .bg-pieces {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.1;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="%23ffffff"/></svg>');
      background-size: 150px;
      background-position: center;
      animation: floatBg 30s linear infinite;
    }

    @keyframes floatBg {
      0% { background-position: 0px 0px; }
      100% { background-position: 150px 150px; }
    }

    /* Game Logo */
    .game-logo {
      z-index: 10;
      text-align: center;
      margin-bottom: 28px;
      animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(0, 0, 0, 0.45);
      padding: 16px 36px;
      border-radius: 22px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .game-logo h1 {
      font-size: 48px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 6px 0 #161625, 0 12px 20px rgba(0,0,0,0.8);
      margin: 0;
      line-height: 1;
    }
    .game-logo span {
      display: block;
      font-size: 22px;
      font-weight: 800;
      color: #ffd700;
      letter-spacing: 8px;
      text-shadow: 0 3px 0 #996515, 0 6px 15px rgba(0,0,0,0.6);
      margin-top: 5px;
    }

    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Chunky Game Buttons & Menu Stretching */
    #menu-screen .main-column {
      height: 100%;
      max-height: 94vh;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      padding: 12px 0;
      box-sizing: border-box;
    }

    .menu-buttons {
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 16px;
      width: 100%;
      max-width: 380px;
      flex: 1;
      max-height: 560px;
      box-sizing: border-box;
    }

    .menu-bot-row {
      display: flex;
      gap: 12px;
      width: 100%;
      flex: 1;
      min-height: 54px;
      max-height: 72px;
    }

    .menu-bot-row .btn-game {
      flex: 1;
      height: 100%;
      font-size: 16px;
      padding: 0 8px;
      border-radius: 18px;
    }

    .menu-main-btn {
      flex: 1.15;
      min-height: 60px;
      max-height: 80px;
      font-size: 22px;
      width: 100%;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-customize {
      background: linear-gradient(135deg, #e67e22, #d35400) !important;
      box-shadow: 0 8px 0 #a04000, 0 15px 20px rgba(0,0,0,0.4) !important;
    }
    .btn-customize:active {
      box-shadow: 0 0px 0 #a04000, 0 5px 10px rgba(0,0,0,0.4) !important;
    }

    .menu-icon-row {
      display: flex;
      gap: 24px;
      justify-content: center;
      align-items: center;
      flex: 1;
      min-height: 70px;
      max-height: 88px;
    }

    .btn-icon-round {
      width: 80px;
      height: 80px;
      padding: 0;
      margin: 0;
      border-radius: 24px;
      border: 4px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-game {
      background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
      border: 4px solid #fff;
      border-radius: 20px;
      padding: 18px 24px;
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      cursor: pointer;
      box-shadow: 0 8px 0 #0088cc, 0 15px 20px rgba(0,0,0,0.4);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn-game:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.15);
    }

    .btn-game:active {
      transform: translateY(8px) scale(1) !important;
      box-shadow: 0 0px 0 #0088cc, 0 5px 10px rgba(0,0,0,0.4);
    }

    .btn-secondary {
      background: linear-gradient(to bottom, #f6d365 0%, #fda085 100%);
      box-shadow: 0 8px 0 #d97745, 0 15px 20px rgba(0,0,0,0.4);
    }
    .btn-secondary:active {
      box-shadow: 0 0px 0 #d97745, 0 5px 10px rgba(0,0,0,0.4);
    }
    
    .btn-tertiary {
      background: linear-gradient(to bottom, #43e97b 0%, #38f9d7 100%);
      box-shadow: 0 8px 0 #28b463, 0 15px 20px rgba(0,0,0,0.4);
    }
    .btn-tertiary:active {
      box-shadow: 0 0px 0 #28b463, 0 5px 10px rgba(0,0,0,0.4);
    }



    /* Pairing Screen */
    .pairing-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 60px 40px 40px 40px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .pairing-container h2 {
      color: #fff;
      margin-bottom: 30px;
      text-align: center;
    }
    .pairing-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top-color: #4facfe;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .pairing-match {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      text-align: center;
      gap: 15px;
    }
    .match-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      font-weight: bold;
      gap: 10px;
      max-width: 120px;
    }
    .match-player span:first-of-type {
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .match-player .player-avatar {
      width: 60px; height: 60px; font-size: 32px;
    }
    .match-vs {
      font-size: 24px; color: #ffd700; font-weight: 900; font-style: italic;
    }
    .match-rating {
      color: #ffd700; font-size: 14px;
    }

    /* In-Game Screen & Board HUD */
    #game-screen {
      padding: 20px;
    }

    /* Top HUD */
    .hud-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .btn-pause {
      display: none; /* Hide pause button from main screen layout */
    }

    .btn-back {
      background: linear-gradient(to bottom, #747d8c 0%, #2f3542 100%) !important;
      box-shadow: 0 4px 0 #1e222b, 0 8px 10px rgba(0,0,0,0.3) !important;
      padding: 8px 14px !important;
      font-size: 14px !important;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 12px !important;
      border: 3px solid #fff !important;
      margin: 0;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }
    .btn-back:active {
      transform: translateY(4px) !important;
      box-shadow: 0 0px 0 #1e222b, 0 4px 5px rgba(0,0,0,0.3) !important;
    }

    .player-hud {
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.5);
      border-radius: 30px;
      padding: 6px 16px;
      border: 2px solid rgba(255,255,255,0.2);
      gap: 12px;
      height: 52px;
    }
    .player-avatar {
      width: 38px;
      height: 38px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .player-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .player-name {
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-score {
      color: #ffd700;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Mobile Balanced Spacing & Vertical Utilization */
    @media (max-width: 600px) {
      #menu-screen {
        padding: 20px 16px;
      }
      #menu-screen .main-column {
        height: 100%;
        justify-content: space-evenly;
      }
      .game-logo {
        margin-bottom: 20px;
        padding: 14px 28px;
        border-radius: 20px;
      }
      .game-logo h1 {
        font-size: 42px;
      }
      .game-logo span {
        font-size: 18px;
        letter-spacing: 6px;
      }
      .menu-buttons {
        gap: 14px;
        max-width: 340px;
        width: 100%;
      }
      .menu-bot-row {
        min-height: 52px;
        max-height: 66px;
      }
      .menu-bot-row .btn-game {
        font-size: 15px;

    /* Board Area */
    .board-wrapper {
      width: min(86vw, 66vh, 560px);
      height: min(86vw, 66vh, 560px);
      aspect-ratio: 1/1;
      background: #739552;
      border: 8px solid #3c2a21;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      position: relative;
    }
    .board-sq {
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .board-classic .board-sq.light { background: #ebecd0; }
    .board-classic .board-sq.dark { background: #739552; }

    /* Dusk — warm amber and dark brown */
    .board-dusk .board-sq.light { background: #e8c98a; }
    .board-dusk .board-sq.dark { background: #7a4a28; }

    /* Ocean — cool teal and slate */
    .board-ocean .board-sq.light { background: #a8d8ea; }
    .board-ocean .board-sq.dark { background: #1b6ca8; }

    /* Midnight — high contrast near-black */
    .board-midnight .board-sq.light { background: #3a3a5c; }
    .board-midnight .board-sq.dark { background: #1a1a2e; }

    /* Additional Premium Boards */
    .board-forest .board-sq.light { background: #c1d9b7; }
    .board-forest .board-sq.dark { background: #4a7542; }
    
    .board-magma .board-sq.light { background: #fca311; }
    .board-magma .board-sq.dark { background: #780000; }
    
    .board-bubblegum .board-sq.light { background: #ffc2d1; }
    .board-bubblegum .board-sq.dark { background: #fb6f92; }
    
    .board-monochrome .board-sq.light { background: #e0e0e0; }
    .board-monochrome .board-sq.dark { background: #424242; }
    
    .board-neon .board-sq.light { background: #0b090a; }
    .board-neon .board-sq.dark { background: #38f9d7; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }

    .board-sq.selected { background: #f5f682 !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
    
    .board-sq img.piece {
      width: 90%;
      height: 90%;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s;
    }
    .board-sq img.piece.dragging {
      transform: scale(1.3) rotate(-5deg);
      filter: drop-shadow(0 15px 10px rgba(0,0,0,0.6));
      z-index: 1000;
      position: relative;
    }
    .board-sq.selected img.piece {
      transform: scale(1.3) rotate(-5deg);
      filter: drop-shadow(0 15px 10px rgba(0,0,0,0.6));
      z-index: 1000;
      position: relative;
    }
    
    @keyframes dropSnap {
      0% { transform: scale(1.3); }
      40% { transform: scale(0.85); }
      100% { transform: scale(1); }
    }
    img.piece.animate-drop {
      animation: dropSnap 0.2s ease-out;
    }

    .legal-dot {
      width: 28%;
      height: 28%;
      background: rgba(0, 242, 254, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      position: absolute;
      pointer-events: none;
      z-index: 500;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
      transition: transform 0.15s ease;
    }
    .legal-dot.capture {
      width: 82%;
      height: 82%;
      background: rgba(255, 71, 87, 0.25);
      border: 4px solid rgba(255, 71, 87, 0.85);
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(255, 71, 87, 0.8), inset 0 0 10px rgba(255, 71, 87, 0.4);
      animation: capturePulse 1.2s infinite alternate ease-in-out;
    }
    @keyframes capturePulse {
      0% { transform: scale(0.95); opacity: 0.85; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    /* King in check */
    .board-sq.in-check {
      background: radial-gradient(circle, rgba(255, 71, 87, 0.95) 0%, rgba(255, 71, 87, 0.5) 75%) !important;
      box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.8), 0 0 20px rgba(255, 71, 87, 0.8);
      animation: checkPulse 0.9s infinite alternate ease-in-out !important;
    }
    @keyframes checkPulse {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.35); }
    }

    /* Board Coordinate Labels */
    .board-coord-rank {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      opacity: 0.65;
      pointer-events: none;
      z-index: 10;
      user-select: none;
      font-family: monospace;
    }
    .board-coord-file {
      position: absolute;
      bottom: 2px;
      right: 3px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      opacity: 0.65;
      pointer-events: none;
      z-index: 10;
      user-select: none;
      font-family: monospace;
    }
    .board-sq.light .board-coord-rank,
    .board-sq.light .board-coord-file {
      color: #3c2a21;
    }
    .board-sq.dark .board-coord-rank,
    .board-sq.dark .board-coord-file {
      color: #ebecd0;
    }

    /* Rewarded Ad Badges & Buttons */
    .ad-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      color: #1a1a2e;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 6px;
      margin-right: 5px;
      vertical-align: middle;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-ad-reward {
      background: linear-gradient(135deg, #f1c40f, #e67e22) !important;
      box-shadow: 0 6px 0 #a04000, 0 12px 18px rgba(0,0,0,0.4) !important;
      border: 3px solid #fff !important;
    }
    .btn-ad-reward:active {
      box-shadow: 0 0 0 #a04000, 0 4px 8px rgba(0,0,0,0.4) !important;
    }

    /* Puzzle Info Bar */
    #puzzle-info-bar {
      width: 100%;
      max-width: 560px;
      background: linear-gradient(135deg, rgba(20, 20, 35, 0.92), rgba(35, 35, 60, 0.92));
      border: 2px solid #38f9d7;
      border-radius: 14px;
      padding: 8px 14px;
      margin-bottom: 8px;
      display: none;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 15px rgba(56, 249, 215, 0.25);
      z-index: 15;
    }
    #puzzle-title-text {
      color: #fff;
      font-weight: 800;
      font-size: 15px;
    }
    #puzzle-turn-text {
      color: #ffd700;
      font-size: 13px;
      font-weight: 700;
    }
    .btn-puzzle-next {
      background: linear-gradient(to bottom, #43e97b 0%, #38f9d7 100%);
      box-shadow: 0 3px 0 #28b463;
      border: 2px solid #fff;
      border-radius: 10px;
      padding: 5px 12px;
      color: #1a1a2e;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s;
    }
    .btn-puzzle-next:active {
      transform: translateY(2px);
    }

    /* Game Juice Animations */
    .board-sq.last-move {
      background: rgba(255, 255, 0, 0.4) !important;
      box-shadow: inset 0 0 15px rgba(255,215,0,0.5);
    }
    
    @keyframes screenShake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
    .board-shake { animation: screenShake 0.3s; }
    .shake-delay-1 { animation: screenShake 0.3s 0.05s; }
    .shake-delay-2 { animation: screenShake 0.3s 0.1s; }

    /* Bottom HUD */
    .hud-bottom {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
    }

    /* Pause Menu Overlay */
    #pause-menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #pause-menu.active {
      opacity: 1;
      pointer-events: auto;
    }
    .pause-box {
      background: #2e2e4f;
      border: 4px solid #fff;
      border-radius: 20px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #pause-menu.active .pause-box {
      transform: scale(1);
    }

    /* Hint Highlights & Effects */
    @keyframes hint-pulse-gold {
      0% {
        box-shadow: inset 0 0 0 3px #ffd700, 0 0 15px rgba(255, 215, 0, 0.7);
        background-color: rgba(255, 215, 0, 0.45) !important;
      }
      50% {
        box-shadow: inset 0 0 0 4px #fff, 0 0 25px rgba(255, 215, 0, 0.95);
        background-color: rgba(255, 215, 0, 0.7) !important;
      }
      100% {
        box-shadow: inset 0 0 0 3px #ffd700, 0 0 15px rgba(255, 215, 0, 0.7);
        background-color: rgba(255, 215, 0, 0.45) !important;
      }
    }

    @keyframes hint-target-pulse {
      0% {
        box-shadow: inset 0 0 0 3px #2ed573, 0 0 15px rgba(46, 213, 115, 0.7);
        background-color: rgba(46, 213, 115, 0.45) !important;
      }
      50% {
        box-shadow: inset 0 0 0 4px #fff, 0 0 25px rgba(46, 213, 115, 0.95);
        background-color: rgba(46, 213, 115, 0.7) !important;
      }
      100% {
        box-shadow: inset 0 0 0 3px #2ed573, 0 0 15px rgba(46, 213, 115, 0.7);
        background-color: rgba(46, 213, 115, 0.45) !important;
      }
    }

    .board-sq.hint-from-sq {
      animation: hint-pulse-gold 1.2s infinite ease-in-out !important;
      z-index: 10 !important;
    }

    .board-sq.hint-to-sq {
      animation: hint-target-pulse 1.2s infinite ease-in-out !important;
      z-index: 10 !important;
    }

    .hint-indicator-badge {
      position: absolute;
      top: 3px;
      right: 3px;
      font-size: 15px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
      animation: bounce 0.8s infinite alternate ease-in-out;
      pointer-events: none;
      z-index: 15;
    }

    .hint-target-marker {
      position: absolute;
      width: 44%;
      height: 44%;
      top: 28%;
      left: 28%;
      border-radius: 50%;
      border: 3px solid #2ed573;
      background: rgba(46, 213, 115, 0.35);
      box-shadow: 0 0 14px #2ed573;
      pointer-events: none;
      z-index: 14;
      animation: pulse-target-dot 1.2s infinite ease-in-out;
    }

    @keyframes pulse-target-dot {
      0% { transform: scale(0.8); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(0.8); opacity: 0.7; }
    }

    #hint-notification-banner {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
      border: 2px solid #ffd700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7), 0 0 20px rgba(255, 215, 0, 0.4);
      color: #fff;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      z-index: 120;
      display: none;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      backdrop-filter: blur(8px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }
  </style>

  <div id="game-container">

      <div class="bg-pieces"></div>

            <button class="btn-game btn-secondary menu-main-btn" onclick="startGame('online')">

            </button>

            </button>

                <img id="img-bullet-toggle" src="images/Misc/clock.svg" style="width: 42px; height: 42px; filter: invert(1); opacity: 0.5; pointer-events: none;">
              </button>
              <button id="btn-audio-menu" class="btn-game btn-icon-round" onclick="toggleAudio()">
                <img id="img-audio-menu" src="images/Misc/volume-up.svg" style="width: 42px; height: 42px; filter: invert(1); opacity: 1; pointer-events: none;">
              </button>
            </div>
          </div>
        </div>

        <div class="side-panel leaderboard-panel">
          <h3>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -3px; margin-right: 6px;"><path d="M6 9H4a2 2 0 0 1-2-2V5h4"/><path d="M18 9h2a2 2 0 0 0 2-2V5h-4"/><path d="M4 5h16v5a7 7 0 0 1-14 0V5z"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>
            Leaderboard

          <div class="leaderboard-list" id="lb-list-container">

          </div>
        </div>
      </div>
    </div>

    <!-- Matchmaking & Pairing Screen -->
    <div id="pairing-screen" class="screen" style="justify-content: center;">
      <div class="bg-pieces"></div>
      <div class="pairing-container">
        <h2 id="pairing-status">Searching for Opponent...</h2>
        <div class="pairing-spinner" id="pairing-spinner"></div>
        <div class="pairing-match" id="pairing-match" style="display: none;">
          <div class="match-player">
            <div class="player-avatar">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#38f9d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <span id="match-user-name">You</span>
            <span class="match-rating" id="match-user-rating">800</span>
          </div>
          <div class="match-vs">VS</div>

        <button id="btn-ad-time" class="btn-game btn-ad-reward" style="font-size: 18px; padding: 12px 20px; display: none;" onclick="requestReward('extra_time')"><span class="ad-badge">AD</span> +30 Seconds</button>
        <button id="btn-ad-hint" class="btn-game btn-ad-reward" style="font-size: 18px; padding: 12px 20px; display: none;" onclick="requestReward('hint')"><span class="ad-badge">AD</span> Hint (<span id="pause-hints-left">3</span> left)</button>
        <button id="btn-ad-undo" class="btn-game btn-ad-reward" style="font-size: 18px; padding: 12px 20px; display: none;" onclick="requestReward('undo_move')"><span class="ad-badge">AD</span> Undo Blunder</button>

    <!-- Endgame Modal -->
    <div id="endgame-modal" style="display: none; position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:200; flex-direction:column; align-items:center; justify-content:center;">
      <div style="background: #191930; border: 4px solid rgba(255,255,255,0.8); border-radius: 20px; padding: 40px; text-align: center; width: 80%; max-width: 400px; box-shadow: 0 0 50px rgba(0,0,0,0.9);">
        <h2 id="endgame-title" style="color: #ffd700; font-size: 40px; margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 4px 10px rgba(0,0,0,0.5);">VICTORY</h2>
        <div style="margin-bottom: 30px;">
          <div id="endgame-rating-label" style="color: #e2e8f0; font-size: 18px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 2px 6px rgba(0,0,0,0.6); margin-bottom: 10px;">Rating</div>
          <div id="endgame-elo" style="color: #4facfe; font-size: 48px; font-weight: 900; font-family: monospace; text-shadow: 0 4px 10px rgba(0,0,0,0.6);">800</div>
          <div id="endgame-diff" style="color: #38f9d7; font-size: 20px; font-weight: bold; margin-top: 5px; text-shadow: 0 2px 6px rgba(0,0,0,0.5);">+25</div>
        </div>
        <button id="btn-rematch" class="btn-game btn-tertiary pulse" style="font-size: 20px; padding: 12px 30px; width: 100%; margin-bottom: 20px; display: none;" onclick="rematchGame()">Play Again</button>
        <button class="btn-game" style="font-size: 20px; padding: 12px 30px; width: 100%;" onclick="closeEndgameModal()">Main Menu</button>
      </div>

  </div>

  <script>
    // Initialize Playgama SDK
    bridge.initialize()
      .then(() => {
        console.log("Playgama Bridge SDK initialized successfully.");
        
        // Listen to audio changes
        bridge.platform.on(bridge.EVENT_NAME.AUDIO_STATE_CHANGED, isEnabled => {
          audioOn = isEnabled;
          setAdAudioMute(!audioOn);
          updateAudioUI();
        });

        // Listen to pause changes
        bridge.platform.on(bridge.EVENT_NAME.PAUSE_STATE_CHANGED, isPaused => {
          const pm = document.getElementById('pause-menu');
          if (isPaused) {
            setAdAudioMute(true);
            if (pm && !pm.classList.contains('active')) {
              pm.classList.add('active');
              clearInterval(clockInterval);
            }
          } else {
            setAdAudioMute(false);
            if (pm && pm.classList.contains('active')) {
              pm.classList.remove('active');
              if (bulletModeActive) {
                startClocks();
              }
            }
          }
        });

        // Apply initial audio state
        if (bridge.platform.isAudioEnabled === false) {
          audioOn = false;
        }

        // Initialize user after SDK is ready
        initUser();
        applyDebugMode();
      })
      .catch(error => {
        console.error("Playgama Bridge SDK initialization failed:", error);
        initUser();
        applyDebugMode();
      });

    /**
     * Developer debugging mode controller
     * Can be enabled via ?debug=true URL parameter or by tapping the game logo 5 times
     */
    let isDebugMode = (
      window.location.search.includes('debug=true') || 
      window.location.hash.includes('debug') ||
      localStorage.getItem('chess_debug') === 'true'
    );

    let logoClickCount = 0;
    let logoClickTimer = null;
    function handleLogoClick() {
      logoClickCount++;
      clearTimeout(logoClickTimer);
      logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 1500);

      if (logoClickCount >= 5) {
        logoClickCount = 0;
        isDebugMode = !isDebugMode;
        if (isDebugMode) {
          localStorage.setItem('chess_debug', 'true');
          alert("🛠️ Debug Mode ENABLED! (Test buttons are now visible in matches)");
        } else {
          localStorage.removeItem('chess_debug');
          alert("🔒 Debug Mode DISABLED. (Clean production UI)");
        }
        applyDebugMode();
      }
    }

    function applyDebugMode() {
      const winBtn = document.getElementById('btn-test-win');
      if (winBtn) {
        winBtn.style.display = isDebugMode ? 'block' : 'none';
      }
    }

    // Console Debug Helpers (accessible via F12 console)
    window.debugHint = function() {
      hintsUsed = Math.max(0, hintsUsed - 1);
      requestHintMove();
      console.log("Debug Hint Triggered! Active Hint:", activeHint);
    };
    window.debugEngine = function() {
      console.log("♟️ Stockfish Engine:", engine, "Ready:", engineReady);
      return { ready: engineReady, engine: !!engine };
    };
    window.debugSetWins = function(n) {
      userProfile.wins = n;
      saveProgress();
      const countEl = document.getElementById('skin-wins-count');
      if (countEl) countEl.innerText = n;
      renderSkinList();
      console.log(`✅ Set wins to ${n}`);
    };
    window.debugSetRating = function(elo) {
      userProfile.rating = elo;
      saveProgress();
      document.getElementById('user-rating-bottom').innerHTML = formatRating(elo);
      console.log(`✅ Set rating to ${elo}`);
    };
    window.debugUnlockAll = function() {
      userProfile.unlockedSkins = [
        ...SKIN_DATA.pieces.map(p => p.id),
        ...SKIN_DATA.boards.map(b => b.id)
      ];
      saveProgress();
      renderSkinList();
      console.log("✅ All skins unlocked!");
    };
    window.debugResetData = function() {
      localStorage.removeItem('chess_user');
      localStorage.removeItem('chess_leaderboard');
      if (typeof bridge !== 'undefined' && bridge.storage && typeof bridge.storage.delete === 'function') {
        bridge.storage.delete(['chess_user', 'chess_leaderboard']).catch(()=>{});
      }
      location.reload();
    };
    window.debugToggle = function() {
      isDebugMode = !isDebugMode;
      if (isDebugMode) localStorage.setItem('chess_debug', 'true');
      else localStorage.removeItem('chess_debug');
      applyDebugMode();
      console.log("Debug Mode is now:", isDebugMode);
    };

    // Audio Manager & SFX Controller (Using Human-Refined Audio Assets from sound2)
    const audioMove = new Audio('sound2/standard/Move.mp3');
    const audioCapture = new Audio('sound2/standard/Capture.mp3');
    const audioCheck = new Audio('sound2/sfx/Check.mp3');
    const audioVictory = new Audio('sound2/sfx/Victory.mp3');
    const audioDefeat = new Audio('sound2/sfx/Defeat.mp3');
    const audioDraw = new Audio('sound2/sfx/Draw.mp3');
    const audioHeartbeat = new Audio('sound2/sfx/Heartbeat.mp3');
    const audioSelect = new Audio('sound2/standard/Select.mp3');
    const audioConfirm = new Audio('sound2/standard/Confirmation.mp3');
    const audioExplosion = new Audio('sound2/standard/Explosion.mp3');
    const audioGenericNotify = new Audio('sound2/sfx/GenericNotify.mp3');

    const allAudios = [audioMove, audioCapture, audioCheck, audioVictory, audioDefeat, audioDraw, audioHeartbeat, audioSelect, audioConfirm, audioExplosion, audioGenericNotify];
    
    let isAdPlaying = false;
    function setAdAudioMute(isMuted) {
      isAdPlaying = isMuted;
      if (isMuted) {
        allAudios.forEach(a => {
          try { a.pause(); } catch(e){}
        });
      }
    }

    function safePlayAudio(audio) {
      if (!audioOn || isAdPlaying || !audio) return;
      try {
        audio.currentTime = 0;
        const p = audio.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      } catch(e) {}
    }

    function playPieceMoveSound(isCapture, isCheck) {
      if (isCheck) {
        safePlayAudio(audioCheck);
      } else if (isCapture) {
        safePlayAudio(audioCapture);
      } else {
        safePlayAudio(audioMove);
      }
    }

    function playTick() {
      safePlayAudio(audioSelect);
    }

    function playBuzzer() {
      safePlayAudio(audioConfirm);
    }

    function playClickSound() {
      safePlayAudio(audioSelect);
    }

    function playConfettiPop() {
      safePlayAudio(audioGenericNotify);
    }

    function playRankUpRumble() {
      safePlayAudio(audioGenericNotify);
    }

    function playRankUpExplosion() {
      safePlayAudio(audioExplosion);
    }

    // Bind click sound to all buttons and selectors globally
    document.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.classList.contains('audio-toggle')) {
        playClickSound();
      }
    });

    let lastHeartbeatTime = 0;
    function playHeartbeat() {
      if (!audioOn || isAdPlaying) return;
      const now = Date.now();
      if (now - lastHeartbeatTime < 1000) return;
      lastHeartbeatTime = now;
      safePlayAudio(audioHeartbeat);
    }

    // Streak Manager
    let currentStreak = 0;
    function handleCaptureStreak(isCapture) {
      if (!audioOn) return;
      if (isCapture) {
        currentStreak++;
        let msg = null;
        if (currentStreak === 1) msg = "Capture!";
        else if (currentStreak === 2) msg = "Double Strike!";
        else if (currentStreak >= 3) msg = "Dominating!";
        
        if (msg && window.speechSynthesis) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(msg);
          utterance.rate = 1.0;
          utterance.volume = 1.0;
          if (window.speechSynthesis.getVoices) {
            const voices = window.speechSynthesis.getVoices();
            const maleVoice = voices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('uk english male') || v.name.toLowerCase().includes('david'));
            if (maleVoice) utterance.voice = maleVoice;
          }
          window.speechSynthesis.speak(utterance);
        }
      } else {
        currentStreak = 0;
      }
    }

    // Speed / Bullet Mode Variables
    let bulletModeActive = false;
    let userTimeLeft = 60;
    let oppTimeLeft = 60;
    let clockInterval = null;
    let lastActiveGameMode = '';

    function toggleBulletMode() {
      bulletModeActive = !bulletModeActive;
      const btn = document.getElementById('btn-bullet-toggle');
      const img = document.getElementById('img-bullet-toggle');
      if (bulletModeActive) {
        btn.classList.add('active');
        if(img) img.style.opacity = '1';
      } else {
        btn.classList.remove('active');
        if(img) img.style.opacity = '0.5';
      }
      playTick();
    }

    // Tier System
    function getTier(elo) {
      if (elo < 1200) return { name: 'Bronze', img: 'bronze.svg', color: '#cd7f32' };
      if (elo < 1500) return { name: 'Silver', img: 'silver.svg', color: '#c0c0c0' };
      if (elo < 1800) return { name: 'Gold', img: 'gold.svg', color: '#ffd700' };
      if (elo < 2200) return { name: 'Platinum', img: 'platinum.svg', color: '#e5e4e2' };
      return { name: 'Diamond', img: 'diamond.svg', color: '#b9f2ff' };
    }

    function formatRating(elo) {
      const tier = getTier(elo);
      return `<img src="images/tiers/${tier.img}" style="height: 1.2em; vertical-align: sub; margin-right: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));" alt="${tier.name}"> ${elo}`;
    }

    function formatDisplayName(name, maxLen = 11) {
      if (!name) return 'Guest';
      let str = String(name).trim();
      str = str.replace(/^Anonymous\b/i, 'Guest');
      if (str.length > maxLen) {
        return str.substring(0, maxLen - 2) + '...';
      }
      return str;
    }

    // User Identity & Leaderboard Logic
    let userProfile = { name: 'Guest', rating: 800, wins: 0, pieceSet: 'classic', boardTheme: 'classic', unlockedSkins: ['classic'], skinAdProgress: {} };
    let cachedLeaderboard = null;

    const SKIN_DATA = {
      pieces: [
        { id: 'classic', name: 'Classic', winsReq: 0, adsReq: 0, cssFilter: 'none' },
        { id: 'ruby', name: 'Ruby', winsReq: 1, adsReq: 2, cssFilter: 'sepia(1) saturate(5) hue-rotate(320deg)' },
        { id: 'sapphire', name: 'Sapphire', winsReq: 2, adsReq: 2, cssFilter: 'sepia(1) saturate(5) hue-rotate(200deg)' },
        { id: 'emerald', name: 'Emerald', winsReq: 3, adsReq: 2, cssFilter: 'sepia(1) saturate(5) hue-rotate(100deg)' },
        { id: 'amethyst', name: 'Amethyst', winsReq: 4, adsReq: 2, cssFilter: 'sepia(1) saturate(5) hue-rotate(260deg)' },
        { id: 'topaz', name: 'Topaz', winsReq: 5, adsReq: 2, cssFilter: 'sepia(1) saturate(5) hue-rotate(20deg)' },
        { id: 'aquamarine', name: 'Aqua', winsReq: 7, adsReq: 2, cssFilter: 'sepia(1) saturate(5) hue-rotate(170deg) brightness(1.2)' },
        { id: 'obsidian', name: 'Obsidian', winsReq: 10, adsReq: 2, cssFilter: 'sepia(1) saturate(2) hue-rotate(200deg) brightness(0.6) contrast(1.5)' },
        { id: 'gold', name: 'Gold', winsReq: 15, adsReq: 3, cssFilter: 'sepia(1) saturate(6) hue-rotate(35deg) brightness(1.2)' },
        { id: 'diamond', name: 'Diamond', winsReq: 20, adsReq: 3, cssFilter: 'sepia(0.2) saturate(0.5) hue-rotate(180deg) brightness(1.5)' },
        { id: 'bloodstone', name: 'Blood', winsReq: 25, adsReq: 3, cssFilter: 'sepia(1) saturate(10) hue-rotate(330deg) contrast(1.2)' },
        { id: 'emerald_deep', name: 'Venom', winsReq: 30, adsReq: 3, cssFilter: 'sepia(1) saturate(8) hue-rotate(120deg) brightness(0.8)' },
        { id: 'neon_pink', name: 'Neon Pink', winsReq: 40, adsReq: 3, cssFilter: 'sepia(1) saturate(10) hue-rotate(290deg) brightness(1.3)' },
        { id: 'royal_purple', name: 'Royal', winsReq: 50, adsReq: 3, cssFilter: 'sepia(1) saturate(8) hue-rotate(250deg) brightness(0.9)' }
      ],
      boards: [
        { id: 'classic', name: 'Classic', winsReq: 0, adsReq: 0, cssClass: 'board-classic' },
        { id: 'dusk', name: 'Dusk', winsReq: 1, adsReq: 2, cssClass: 'board-dusk' },
        { id: 'ocean', name: 'Ocean', winsReq: 3, adsReq: 2, cssClass: 'board-ocean' },
        { id: 'forest', name: 'Forest', winsReq: 5, adsReq: 2, cssClass: 'board-forest' },
        { id: 'midnight', name: 'Midnight', winsReq: 10, adsReq: 2, cssClass: 'board-midnight' },
        { id: 'magma', name: 'Magma', winsReq: 15, adsReq: 3, cssClass: 'board-magma' },
        { id: 'bubblegum', name: 'Bubblegum', winsReq: 20, adsReq: 3, cssClass: 'board-bubblegum' },
        { id: 'monochrome', name: 'Noir', winsReq: 30, adsReq: 3, cssClass: 'board-monochrome' },
        { id: 'neon', name: 'Cyber', winsReq: 50, adsReq: 3, cssClass: 'board-neon' }
      ]
    };

    function isSkinUnlocked(type, skin) {
      if (!skin || skin.winsReq === 0 || skin.id === 'classic') return true;
      if ((userProfile.wins || 0) >= skin.winsReq) return true;
      if (userProfile.unlockedSkins && userProfile.unlockedSkins.includes(skin.id)) return true;
      return false;
    }

    function unlockSkinWithAd(type, skinId) {
      requestReward(`skin_${type}_${skinId}`);
    }
    
    function grantReward(placement) {
      if (placement === 'extra_time') {
        userTimeLeft += 30;
        updateClockDisplay();
        const pm = document.getElementById('pause-menu');
        if (pm && pm.classList.contains('active')) togglePause();
      } else if (placement === 'hint') {
        hintsUsed++;
        updateHintButtonUI();
        requestHintMove();
        const pm = document.getElementById('pause-menu');
        if (pm && pm.classList.contains('active')) togglePause();
      } else if (placement === 'undo_move') {
        if (engine && engineReady) {
          try { engine.postMessage('stop'); } catch(e) {}
        }
        game.undo(); 
        if (game.turn() !== 'w') { // Assuming user is always white (default in this game)
           game.undo();
        }
        lastMoveSqs = [];
        clearActiveHint();
        renderBoard('main-board');
        const pm = document.getElementById('pause-menu');
        if (pm && pm.classList.contains('active')) togglePause();
      } else if (placement && placement.startsWith('skin_')) {
        const parts = placement.split('_');
        const type = parts[1]; // 'boardTheme' or 'pieceSet'
        const skinId = parts.slice(2).join('_');

        const list = (type === 'boardTheme') ? SKIN_DATA.boards : SKIN_DATA.pieces;
        const skin = list.find(s => s.id === skinId);
        if (!skin) return;

        const adsReq = skin.adsReq || (skin.winsReq <= 10 ? 2 : 3);
        userProfile.skinAdProgress = userProfile.skinAdProgress || {};
        userProfile.skinAdProgress[skinId] = (userProfile.skinAdProgress[skinId] || 0) + 1;

        if (userProfile.skinAdProgress[skinId] >= adsReq) {
          userProfile.unlockedSkins = userProfile.unlockedSkins || ['classic'];
          if (!userProfile.unlockedSkins.includes(skinId)) {
            userProfile.unlockedSkins.push(skinId);
          }
          userProfile[type] = skinId; // Auto-select newly unlocked skin

          // Celebration confetti
          if (typeof confetti !== 'undefined') {
            confetti({
              particleCount: 60,
              spread: 70,
              origin: { y: 0.6 }
            });
          }
        }

        saveProgress();
        renderSkinList();
        renderBoard('main-board');
      }
    }

    // Unified Dual-Storage Persistence (LocalStorage + Playgama Bridge Cloud Storage)
    function saveProgress() {
      const userJson = JSON.stringify(userProfile);
      const lbJson = JSON.stringify(cachedLeaderboard || []);

      // 1. Immediately save to LocalStorage (Instant, persistent across reloads)
      try {
        localStorage.setItem('chess_user', userJson);
        if (cachedLeaderboard && cachedLeaderboard.length > 0) {
          localStorage.setItem('chess_leaderboard', lbJson);
        }
      } catch (e) {
        console.warn("LocalStorage save error:", e);
      }

      // 2. Save to Playgama Bridge Cloud Storage
      if (typeof bridge !== 'undefined' && bridge.storage && typeof bridge.storage.set === 'function') {
        bridge.storage.set(['chess_user', 'chess_leaderboard'], [userJson, lbJson])
          .then(() => {
            // Cloud save confirmed
          })
          .catch(err => {
            console.warn("Bridge storage.set error:", err);
          });
      }
    }

    function applyLoadedProfile(data) {
      if (!data || typeof data !== 'object') return;
      if (data.name) {
        userProfile.name = String(data.name).replace(/^Anonymous\b/i, 'Guest');
      }
      if (typeof data.rating === 'number' && !isNaN(data.rating)) {
        userProfile.rating = data.rating;
      }
      if (typeof data.wins === 'number' && !isNaN(data.wins)) {
        userProfile.wins = data.wins;
      }
      if (data.pieceSet) userProfile.pieceSet = data.pieceSet;
      if (data.boardTheme) userProfile.boardTheme = data.boardTheme;
      if (Array.isArray(data.unlockedSkins)) {
        userProfile.unlockedSkins = data.unlockedSkins;
      }
      if (data.skinAdProgress && typeof data.skinAdProgress === 'object') {
        userProfile.skinAdProgress = data.skinAdProgress;
      }
    }

    function initUser() {
      // Configure Interstitial Pacing and Rewarded Ads logic
      if (typeof bridge !== 'undefined' && bridge.advertisement) {
        if (typeof bridge.advertisement.setMinimumDelayBetweenInterstitial === 'function') {
          bridge.advertisement.setMinimumDelayBetweenInterstitial(120);
        }

        bridge.advertisement.on(bridge.EVENT_NAME.INTERSTITIAL_STATE_CHANGED, state => {
          if (state === 'opened' || state === 'loading') {
            setAdAudioMute(true);
          } else if (state === 'closed' || state === 'failed') {
            setAdAudioMute(false);
          }
        });
        
        bridge.advertisement.on(bridge.EVENT_NAME.REWARDED_STATE_CHANGED, state => {
          console.log("Playgama Rewarded Ad state:", state);
          if (state === 'opened' || state === 'loading') {
            setAdAudioMute(true);
          } else if (state === 'rewarded') {
            setAdAudioMute(false);
            const placement = currentRequestedPlacement || (bridge.advertisement ? bridge.advertisement.rewardedPlacement : null);
            if (placement) {
              grantReward(placement);
            }
          } else if (state === 'closed' || state === 'failed') {
            setAdAudioMute(false);
            currentRequestedPlacement = null;
          }
        });
      }

      // 1. Immediately restore from LocalStorage for instant UI render
      let localUserRaw = null;
      let localLbRaw = null;
      try {
        localUserRaw = localStorage.getItem('chess_user');
        localLbRaw = localStorage.getItem('chess_leaderboard');
      } catch (e) {}

      let hasLocalData = false;
      if (localUserRaw) {
        try {
          applyLoadedProfile(JSON.parse(localUserRaw));
          hasLocalData = true;
        } catch(e) {}
      }

      if (localLbRaw) {
        try {
          cachedLeaderboard = JSON.parse(localLbRaw);
        } catch(e) {}
      }

      if (!hasLocalData) {
        createDefaultProfile();
      }

      if (!cachedLeaderboard || cachedLeaderboard.length === 0) {
        cachedLeaderboard = generateRegionalLeaderboard();
      }

      updateProfileUI();
      renderLeaderboard();

      // 2. Query Playgama Bridge Storage to sync with cloud data
      if (typeof bridge !== 'undefined' && bridge.storage && typeof bridge.storage.get === 'function') {
        bridge.storage.get(['chess_user', 'chess_leaderboard'])
          .then(data => {
            const cloudUser = data && data[0];
            const cloudLb = data && data[1];

            if (cloudUser) {
              try {
                const parsed = typeof cloudUser === 'string' ? JSON.parse(cloudUser) : cloudUser;
                applyLoadedProfile(parsed);
              } catch(e) {
                console.error("Error parsing cloud user:", e);
              }
            }

            if (cloudLb) {
              try {
                const parsedLb = typeof cloudLb === 'string' ? JSON.parse(cloudLb) : cloudLb;
                if (Array.isArray(parsedLb) && parsedLb.length > 0) {
                  cachedLeaderboard = parsedLb.map(p => {
                    if (p.name) p.name = p.name.replace(/^Anonymous\b/i, 'Guest');
                    return p;
                  });
                }
              } catch(e) {}
            }

            if (typeof bridge !== 'undefined' && bridge.player && bridge.player.isAuthorized && bridge.player.name) {
              userProfile.name = bridge.player.name;
            }

            saveProgress();
            updateProfileUI();
            renderLeaderboard();

            if (bridge.platform && typeof bridge.platform.sendMessage === 'function') {
              bridge.platform.sendMessage("game_ready");
            }
          })
          .catch(error => {
            console.warn("Storage loading from bridge failed, using local data:", error);
            saveProgress();
            updateProfileUI();
            renderLeaderboard();
            if (typeof bridge !== 'undefined' && bridge.platform && typeof bridge.platform.sendMessage === 'function') {
              bridge.platform.sendMessage("game_ready");
            }
          });
      } else {
        saveProgress();
        if (typeof bridge !== 'undefined' && bridge.platform && typeof bridge.platform.sendMessage === 'function') {
          bridge.platform.sendMessage("game_ready");
        }
      }
    }

      const userRank = list.findIndex(p => p.isUser) + 1;

    function startClocks() {
      clearInterval(clockInterval);
      clockInterval = setInterval(() => {
        if (game.game_over()) {
          clearInterval(clockInterval);
          return;
        }
        if (game.turn() === 'w') {
          userTimeLeft--;
          if (userTimeLeft <= 10 && userTimeLeft > 0) {
            playHeartbeat();
          }
          if (userTimeLeft <= 0) {
            clearInterval(clockInterval);
            concludeMatch('loss');
          }
        } else {
          oppTimeLeft--;
          if (oppTimeLeft <= 0) {
            clearInterval(clockInterval);
            concludeMatch('win');
          }
        }
        updateClockDisplay();
      }, 1000);
    }

      document.getElementById('user-timer').innerText = formatTime(userTimeLeft);
      document.getElementById('opp-timer').innerText = formatTime(oppTimeLeft);
      
      document.getElementById('user-timer').style.borderColor = userTimeLeft <= 10 ? '#ff4757' : '#38f9d7';
      document.getElementById('user-timer').style.color = userTimeLeft <= 10 ? '#ff4757' : '#38f9d7';
      if (userTimeLeft <= 10) {

    /**
     * Concludes the current game, computes ELO delta, records progression, and notifies the SDK
     * @param {'win'|'loss'|'draw'} result - Outcome of the match
     */
    function concludeMatch(result) {
      const diff = currentOpponentRating - userProfile.rating;
      let winReward = 25;
      let lossPenalty = 20;
      
      if (currentGameMode === 'bot_easy') {
        winReward = 10;
        lossPenalty = 25;
      } else if (currentGameMode === 'bot_medium') {
        winReward = 25;
        lossPenalty = 20;
      } else if (currentGameMode === 'bot_hard') {
        winReward = 40;
        lossPenalty = 10;
      } else if (currentGameMode === 'online') {
        winReward = Math.max(10, 25 + Math.floor(diff / 20));
        lossPenalty = Math.max(10, 20 - Math.floor(diff / 20));
      } else if (currentGameMode === 'puzzles') {
        winReward = 0;
        lossPenalty = 0; // No rating penalty for puzzle attempts
      }

      if (bulletModeActive) {
        winReward = Math.floor(winReward * 1.5);
      }

      clearInterval(clockInterval);
      const oldRating = userProfile.rating;
      let change = 0;
      if (result === 'win') {
        userProfile.rating += winReward;
        userProfile.wins = (userProfile.wins || 0) + 1;
        change = winReward;
      } else {
        userProfile.rating = Math.max(0, oldRating - lossPenalty);
        change = -lossPenalty;
      }
      
      const newRating = userProfile.rating;
      const diffStr = (change > 0 ? '+' : '') + change;
      
      // Save progress to both LocalStorage & Playgama Cloud Storage
      saveProgress();
      document.getElementById('user-rating-bottom').innerHTML = formatRating(userProfile.rating);
      renderLeaderboard();
      
      const oldTier = getTier(oldRating);
      const newTier = getTier(newRating);
      
      // Show interstitial ad on game over
      if (typeof bridge !== 'undefined' && bridge.advertisement && bridge.advertisement.isInterstitialSupported) {
        bridge.advertisement.showInterstitial();
      }

      if (typeof bridge !== 'undefined' && bridge.platform && typeof bridge.platform.sendMessage === 'function') {
        bridge.platform.sendMessage(result === 'win' ? "level_completed" : "level_failed");
      }

      if (result === 'win' && newTier.name !== oldTier.name) {
        triggerRankUpAnimation(newTier, () => {
          showEndgameModal(result, oldRating, newRating, diffStr);
        });
      } else {
        showEndgameModal(result, oldRating, newRating, diffStr);
      }
    }

    function triggerRankUpAnimation(tier, callback) {
      const overlay = document.getElementById('rankup-overlay');
      const stone = document.getElementById('rankup-stone');
      const badge = document.getElementById('rankup-badge');

      badge.style.transform = 'scale(0.1)';

        playRankUpExplosion();
        stone.style.opacity = '0';
        badge.style.opacity = '1';

    function showEndgameModal(result, oldRating, newRating, diffStr) {
      const modal = document.getElementById('endgame-modal');
      const title = document.getElementById('endgame-title');
      const elo = document.getElementById('endgame-elo');
      const diffLabel = document.getElementById('endgame-diff');
      const ratingLabel = document.getElementById('endgame-rating-label');
      const rematchBtn = document.getElementById('btn-rematch');
      
      title.innerText = result === 'win' ? 'VICTORY' : 'DEFEAT';
      title.style.color = result === 'win' ? '#ffd700' : '#ff4757';
      elo.innerText = newRating;
      diffLabel.innerText = diffStr;
      diffLabel.style.color = result === 'win' ? '#38f9d7' : '#ff4757';

      if (result === 'win') {
        safePlayAudio(audioVictory);
      } else {
        safePlayAudio(audioDefeat);
      }
      
      if (currentGameMode === 'puzzles') {
        title.innerText = 'PUZZLE SOLVED!';
        title.style.color = '#38f9d7';
        rematchBtn.style.display = 'block';
        rematchBtn.innerText = 'Next Puzzle ❯';
        rematchBtn.onclick = function() {
          document.getElementById('endgame-modal').style.display = 'none';
          nextPuzzle();
        };
        elo.style.display = 'none';
        diffLabel.style.display = 'none';
        if (ratingLabel) ratingLabel.style.display = 'none';
      } else {
        rematchBtn.style.display = 'block';
        rematchBtn.innerText = 'Play Again';
        rematchBtn.onclick = rematchGame;
        elo.style.display = 'block';
        diffLabel.style.display = 'block';
        if (ratingLabel) ratingLabel.style.display = 'block';
      }
      
      modal.style.display = 'flex';
      
      if (result === 'win' && typeof confetti !== 'undefined') {
        window.confettiActive = true;
        const duration = 3000;
        const end = Date.now() + duration;

        (function frame() {
          if (!window.confettiActive) return;
          confetti({
            particleCount: 8,
            angle: 60,
            spread: 55,
            origin: { x: 0, y: 0.6 },
            colors: ['#ffd700', '#ff4757', '#00f2fe', '#38f9d7'],
            zIndex: 10000
          });
          confetti({
            particleCount: 8,
            angle: 120,
            spread: 55,
            origin: { x: 1, y: 0.6 },
            colors: ['#ffd700', '#ff4757', '#00f2fe', '#38f9d7'],
            zIndex: 10000
          });

          if (Date.now() < end && window.confettiActive) {
            requestAnimationFrame(frame);
          }
        }());
        
        playConfettiPop();
      }
      
      // Animate ELO
      let currentDisplayRating = oldRating;
      const ticks = 30; // Number of animation frames
      const ratingStep = (newRating - oldRating) / ticks;
      let frame = 0;
      
      function tickAnimation() {
        if (frame < ticks) {
          currentDisplayRating += ratingStep;
          elo.innerHTML = formatRating(Math.round(currentDisplayRating));
          playTick();
          frame++;
          requestAnimationFrame(tickAnimation);
        } else {
          elo.innerHTML = formatRating(newRating);
        }
      }
      
      setTimeout(() => requestAnimationFrame(tickAnimation), 500); // short delay
    }

    let selectedPieceSq = null;
