<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Master Chess HTML5</title>
  
  <style>
    /* CSS Reset and Font Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none; /* Prevent text selection in games */
    }

    body {
      background-color: #1a1a2e;
      font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* No scrolling allowed */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The Game Container - scales to fit screen but maintains aspect ratio */
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: radial-gradient(circle at center, #2e2e4f 0%, #161625 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Screen Management */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }
    
    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* =========================================
       MAIN MENU SCREEN
       ========================================= */
    #menu-screen {
      padding: 20px;
    }

    /* Layout Containers */
    .screen-content {
      display: flex;
      width: 100%;
      max-width: 1000px;
      height: 100%;
      justify-content: center;
      align-items: center;
      gap: 40px;
    }

    .main-column {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
      height: 100%;
      justify-content: center;
      align-items: center;
    }

    #game-screen .main-column {
      justify-content: space-between;
    }

    /* Side Panels */
    .side-panel {
      display: none; /* Hidden by default on mobile */
      flex-direction: column;
      background: rgba(0, 0, 0, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      padding: 24px;
      width: 320px;
      height: min(80vh, 600px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      color: #fff;
      z-index: 10;
    }

    .side-panel h3 {
      margin: 0 0 16px 0;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ffd700;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    /* Leaderboard Styles */
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .lb-item {
      display: flex;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    .lb-score { color: #4facfe; }

    /* Move History Styles */
    .move-list {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .move-row {
      display: flex;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-family: monospace;
      font-size: 16px;
    }
    .move-row:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    .move-num { width: 40px; color: #888; }
    .move-white { flex: 1; color: #fff; font-weight: bold; }
    .move-black { flex: 1; color: #aaa; font-weight: bold; }

    .match-controls {
      display: flex;
      gap: 10px;
    }
    .match-controls .btn-game { flex: 1; }

    /* Show side panels on wide screens */
    @media (min-width: 900px) {
      .side-panel {
        display: flex;
      }
    }

    /* Floating Chess Pieces Background Effect */
    .bg-pieces {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.1;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="%23ffffff"/></svg>');
      background-size: 150px;
      background-position: center;
      animation: floatBg 30s linear infinite;
    }

    @keyframes floatBg {
      0% { background-position: 0px 0px; }
      100% { background-position: 150px 150px; }
    }

    /* Game Logo */
    .game-logo {
      z-index: 10;
      text-align: center;
      margin-bottom: 60px;
      animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(0, 0, 0, 0.45);
      padding: 24px 48px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .game-logo h1 {
      font-size: 64px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 6px 0 #161625, 0 12px 20px rgba(0,0,0,0.8);
      margin: 0;
      line-height: 1;
    }
    .game-logo span {
      display: block;
      font-size: 28px;
      font-weight: 800;
      color: #ffd700;
      letter-spacing: 8px;
      text-shadow: 0 3px 0 #996515, 0 6px 15px rgba(0,0,0,0.6);
      margin-top: 5px;
    }

    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Chunky Game Buttons */
    .menu-buttons {
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 320px;
    }

    .btn-game {
      background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
      border: 4px solid #fff;
      border-radius: 20px;
      padding: 18px 24px;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 0 #0088cc, 0 15px 20px rgba(0,0,0,0.4);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn-game:active {
      transform: translateY(8px);
      box-shadow: 0 0px 0 #0088cc, 0 5px 10px rgba(0,0,0,0.4);
    }

    .btn-secondary {
      background: linear-gradient(to bottom, #f6d365 0%, #fda085 100%);
      box-shadow: 0 8px 0 #d97745, 0 15px 20px rgba(0,0,0,0.4);
    }
    .btn-secondary:active {
      box-shadow: 0 0px 0 #d97745, 0 5px 10px rgba(0,0,0,0.4);
    }
    
    .btn-tertiary {
      background: linear-gradient(to bottom, #43e97b 0%, #38f9d7 100%);
      box-shadow: 0 8px 0 #28b463, 0 15px 20px rgba(0,0,0,0.4);
    }
    .btn-tertiary:active {
      box-shadow: 0 0px 0 #28b463, 0 5px 10px rgba(0,0,0,0.4);
    }

    /* Audio Toggle */
    .audio-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: #4facfe;
      border: 3px solid #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      color: #fff;
      box-shadow: 0 5px 0 #0088cc, 0 10px 10px rgba(0,0,0,0.3);
      transition: all 0.1s ease;
    }
    .audio-toggle:active {
      transform: translateY(5px);
      box-shadow: 0 0px 0 #0088cc, 0 5px 10px rgba(0,0,0,0.3);
    }


    /* =========================================
       IN-GAME SCREEN
       ========================================= */
    #game-screen {
      padding: 20px;
    }

    /* Top HUD */
    .hud-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .btn-pause {
      display: none; /* Hide pause button from main screen layout */
    }

    .btn-back {
      background: linear-gradient(to bottom, #747d8c 0%, #2f3542 100%) !important;
      box-shadow: 0 4px 0 #1e222b, 0 8px 10px rgba(0,0,0,0.3) !important;
      padding: 8px 14px !important;
      font-size: 14px !important;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 12px !important;
      border: 3px solid #fff !important;
      margin: 0;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }
    .btn-back:active {
      transform: translateY(4px) !important;
      box-shadow: 0 0px 0 #1e222b, 0 4px 5px rgba(0,0,0,0.3) !important;
    }

    .player-hud {
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.5);
      border-radius: 30px;
      padding: 6px 16px;
      border: 2px solid rgba(255,255,255,0.2);
      gap: 12px;
      height: 52px;
    }
    .player-avatar {
      width: 38px;
      height: 38px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .player-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .player-name {
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.2;
    }
    .player-score {
      color: #ffd700;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.2;
    }

    /* Board Area */
    .board-wrapper {
      width: min(90vw, 60vh);
      height: min(90vw, 60vh);
      aspect-ratio: 1/1;
      background: #739552;
      border: 8px solid #3c2a21;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      position: relative;
    }
    .board-sq {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .board-sq.light { background: #ebecd0; }
    .board-sq.dark { background: #739552; }
    
    .board-sq img.piece {
      width: 90%;
      height: 90%;
      pointer-events: none;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
    }

    /* Bottom HUD */
    .hud-bottom {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
    }

    /* Pause Menu Overlay */
    #pause-menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #pause-menu.active {
      opacity: 1;
      pointer-events: auto;
    }
    .pause-box {
      background: #2e2e4f;
      border: 4px solid #fff;
      border-radius: 20px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #pause-menu.active .pause-box {
      transform: scale(1);
    }

  </style>
</head>
<body>

  <div id="game-container">
    
    <!-- AUDIO TOGGLE -->
    <div class="audio-toggle" id="btn-audio" onclick="toggleAudio()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
    </div>

    <!-- =========================================
         MAIN MENU SCREEN
         ========================================= -->
    <div id="menu-screen" class="screen active">
      <div class="bg-pieces"></div>
      
      <div class="screen-content">
        <div class="main-column">
          <div class="game-logo">
            <h1>Master</h1>
            <span>CHESS</span>
          </div>

          <div class="menu-buttons">
            <button class="btn-game" onclick="startGame('bot')">
              Play vs Bot
            </button>
            <button class="btn-game btn-secondary" onclick="startGame('online')">
              Multiplayer
            </button>
            <button class="btn-game btn-tertiary" onclick="startGame('puzzles')">
              Puzzles
            </button>
          </div>
        </div>

        <div class="side-panel leaderboard-panel">
          <h3>🏆 Top Players</h3>
          <div class="leaderboard-list">
            <div class="lb-item"><span>1. GM Hikaru</span><span class="lb-score">3240</span></div>
            <div class="lb-item"><span>2. GM Magnus</span><span class="lb-score">3215</span></div>
            <div class="lb-item"><span>3. IM LevyRozman</span><span class="lb-score">2890</span></div>
            <div class="lb-item"><span>4. ChessBot9000</span><span class="lb-score">2750</span></div>
            <div class="lb-item"><span>5. RookieKing</span><span class="lb-score">1850</span></div>
          </div>
        </div>
      </div>
    </div>


    <!-- =========================================
         IN-GAME SCREEN
         ========================================= -->
    <div id="game-screen" class="screen">
      <div class="screen-content">
        <div class="main-column">
          <!-- Top HUD (Opponent) -->
          <div class="hud-top" style="justify-content: flex-start; gap: 15px;">
            <button class="btn-back" onclick="returnToMenu()">◀ Return</button>
            <div class="player-hud">
              <div class="player-avatar">🤖</div>
              <div class="player-info">
                <span class="player-name">Grandmaster Bot</span>
                <span class="player-score">Level 10</span>
              </div>
            </div>
          </div>

          <!-- Chess Board -->
          <div class="board-wrapper" id="main-board">
            <!-- Rendered via JS -->
          </div>

          <!-- Bottom HUD (Player) -->
          <div class="hud-bottom">
            <div class="player-hud">
              <div class="player-info" style="text-align: right;">
                <span class="player-name">You</span>
                <span class="player-score">Beginner</span>
              </div>
              <div class="player-avatar">👤</div>
            </div>
          </div>
        </div>

        <div class="side-panel move-history-panel">
          <h3>Move History</h3>
          <div class="move-list">
            <div class="move-row"><span class="move-num">1.</span><span class="move-white">e4</span><span class="move-black">e5</span></div>
            <div class="move-row"><span class="move-num">2.</span><span class="move-white">Nf3</span><span class="move-black">Nc6</span></div>
            <div class="move-row"><span class="move-num">3.</span><span class="move-white">Bc4</span><span class="move-black">Bc5</span></div>
            <div class="move-row"><span class="move-num">4.</span><span class="move-white">c3</span><span class="move-black">Nf6</span></div>
          </div>
          <div class="match-controls">
            <button class="btn-game btn-secondary" style="font-size: 14px; padding: 10px;">🏳 Resign</button>
            <button class="btn-game" style="font-size: 14px; padding: 10px;">🤝 Draw</button>
          </div>
        </div>
      </div>
    </div>

    <!-- PAUSE MENU OVERLAY -->
    <div id="pause-menu">
      <div class="pause-box">
        <h2 style="color: #fff; text-align: center; margin-bottom: 10px; font-size: 32px;">PAUSED</h2>
        <button class="btn-game" style="font-size: 20px; padding: 12px 20px;" onclick="togglePause()">Resume</button>
        <button class="btn-game btn-secondary" style="font-size: 20px; padding: 12px 20px;" onclick="returnToMenu()">Quit Game</button>
      </div>
    </div>

  </div>

  <script>
    // Screen Management
    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startGame(mode) {
      // In a real game, initialize engine/socket here based on mode
      switchScreen('game-screen');
      // Small delay to ensure rendering before drawing board (optional, but safe)
      setTimeout(() => renderBoard('main-board'), 100);
    }

    function returnToMenu() {
      document.getElementById('pause-menu').classList.remove('active');
      switchScreen('menu-screen');
    }

    // Pause Menu
    function togglePause() {
      const pm = document.getElementById('pause-menu');
      if (pm.classList.contains('active')) {
        pm.classList.remove('active');
      } else {
        pm.classList.add('active');
      }
    }

    // Audio Toggle Mock
    const svgAudioOn = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>';
    const svgAudioOff = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';
    let audioOn = true;
    function toggleAudio() {
      audioOn = !audioOn;
      document.getElementById('btn-audio').innerHTML = audioOn ? svgAudioOn : svgAudioOff;
    }

    // Render 8x8 Board with SVG piece images
    function renderBoard(elementId) {
      const container = document.getElementById(elementId);
      if (!container) return;
      container.innerHTML = '';

      // SVG Piece mapping using /piece/cburnett/ directory
      const pieceMap = {
        'r': 'bR', 'n': 'bN', 'b': 'bB', 'q': 'bQ', 'k': 'bK', 'p': 'bP',
        'R': 'wR', 'N': 'wN', 'B': 'wB', 'Q': 'wQ', 'K': 'wK', 'P': 'wP'
      };

      const defaultBoard = [
        ['r','n','b','q','k','b','n','r'],
        ['p','p','p','p','p','p','p','p'],
        ['.','.','.','.','.','.','.','.'],
        ['.','.','.','.','.','.','.','.'],
        ['.','.','.','.','P','.','.','.'],
        ['.','.','.','.','.','N','.','.'],
        ['P','P','P','P','.','P','P','P'],
        ['R','N','B','Q','K','B','.','R']
      ];

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement('div');
          const isLight = (r + c) % 2 === 0;
          sq.className = 'board-sq ' + (isLight ? 'light' : 'dark');

          const pChar = defaultBoard[r][c];
          if (pChar !== '.' && pieceMap[pChar]) {
            const img = document.createElement('img');
            img.className = 'piece';
            img.src = '/piece/cburnett/' + pieceMap[pChar] + '.svg';
            img.alt = pChar;
            sq.appendChild(img);
          }

          container.appendChild(sq);
        }
      }
    }
  </script>
</body>
</html>
